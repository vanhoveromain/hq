<!doctype html>
<html lang="en" data-hq="sport">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the full iPhone screen; the CSS
       then adds padding for the notch / home bar (safe-area insets). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#222426" media="(prefers-color-scheme: dark)">
  <title>Sport HQ</title>
  <!-- "Add to Home Screen": app name, icon, and open full screen (no browser bars) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/sport-hq.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/sport-hq-icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Sport HQ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- HQ Brand Guidelines v1.0: shared HQ tokens + Geist fonts, then the app's styles -->
  <link rel="preload" href="css/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/hq-tokens.css?v=202611051635">
  <link rel="stylesheet" href="css/style.css?v=202611051635">
</head>
<body>
  <!-- Left: Sport HQ (symbol + name, opens the HQ switcher: hq-home/switcher.js),
       or "‹ Back" on a screen inside another one. Right: one
       action of the screen (e.g. the planner's "⋯"). See js/utils/topbar.js. -->
  <header class="topbar">
    <div class="topbar-left">
      <hq-switcher class="brand" current="sport"><a class="brand-link" href="#/dashboard" aria-label="Sport HQ, back to Home"><img src="icons/sport-hq.svg" alt="" width="28" height="28"><span>Sport HQ</span></a></hq-switcher>
      <a class="topbar-back" id="topbar-back" href="#/dashboard" hidden></a>
    </div>
    <h1 id="page-title" class="page-title"></h1>
    <div class="topbar-right" id="topbar-action"></div>
  </header>

  <!-- Each screen ("view") is drawn inside <main> by its own JS module. -->
  <main id="view" class="view" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>

  <!-- Bottom tab bar (thumb-friendly on a phone). Hidden until logged in.
       The icons are the same line icons as js/utils/icons.js, written out here. -->
  <nav id="tabbar" class="tabbar" hidden>
    <a href="#/dashboard" data-route="dashboard"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</a>
    <a href="#/planner"   data-route="planner"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>Plan</a>
    <a href="#/log"       data-route="log"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>Log</a>
    <a href="#/races"     data-route="races"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>Races</a>
    <a href="#/me"        data-route="me"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Me</a>
  </nav>

  <!-- type="module" turns on ES modules (import/export between files).
       Modules only work when the page is served over http, not file://. -->
  <script type="module" src="js/main.js?v=202611051635"></script>
</body>
</html>
