<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff HQ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --text:#2C4D5C; --muted:#5E6E76; --line:#E1E6E9; --line-strong:#C9D2D7;
  --head:#2C4D5C; --head-text:#FFFFFF; --head-muted:#B9CCD4;
  --green:#27C490; --green-hover:#1FA677; --green-ink:#167A59;
  --bespoke:#27C490; --own:#2C4D5C; --warn:#FF5200; --warn-bg:#FFF1EA;
  --wkend:#EEF1F3; --today:#E6F7F0; --hit:#CFF2E4; --row:#F8FAFB;
  --chip:#F2F5F7; --chip-on:#2C4D5C; --chip-on-text:#FFFFFF;
  --shadow:0 8px 32px rgba(44,77,92,.18);
  --font:"Poppins","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E28; --surface:#16293A; --text:#E4EDF1; --muted:#9DB1BB; --line:#24394A; --line-strong:#33506A;
    --head:#1D3A4A; --head-text:#FFFFFF; --head-muted:#9FBBC8;
    --green:#27C490; --green-hover:#3AD8A3; --green-ink:#5FE0B4;
    --bespoke:#27C490; --own:#7FB2C9; --warn:#FF8A4D; --warn-bg:#3A2418;
    --wkend:#13283A; --today:#123B33; --hit:#1D5A47; --row:#182D3E;
    --chip:#1F3647; --chip-on:#7FB2C9; --chip-on-text:#0F1E28;
    --shadow:0 8px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E28; --surface:#16293A; --text:#E4EDF1; --muted:#9DB1BB; --line:#24394A; --line-strong:#33506A;
  --head:#1D3A4A; --head-text:#FFFFFF; --head-muted:#9FBBC8;
  --green:#27C490; --green-hover:#3AD8A3; --green-ink:#5FE0B4;
  --bespoke:#27C490; --own:#7FB2C9; --warn:#FF8A4D; --warn-bg:#3A2418;
  --wkend:#13283A; --today:#123B33; --hit:#1D5A47; --row:#182D3E;
  --chip:#1F3647; --chip-on:#7FB2C9; --chip-on-text:#0F1E28;
  --shadow:0 8px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* toolbar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{height:32px;width:auto}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-dark{display:block}:root:not([data-theme="light"]) .logo-light{display:none}}
:root[data-theme="dark"] .logo-dark{display:block}:root[data-theme="dark"] .logo-light{display:none}
h1{font-size:1.2rem;font-weight:600;margin:0;letter-spacing:-.01em}
.tabs{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;border-radius:6px;padding:6px 14px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(44,77,92,.18)}
.tabs button.edit-tab[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-text)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.nav{display:flex;align-items:center;gap:4px}
.nav button,.seg button,.ghost{background:transparent;border:1px solid var(--line-strong);border-radius:6px;padding:6px 12px;font-weight:500}
.nav button:hover,.seg button:hover,.ghost:hover{background:var(--chip)}
.nav #prev,.nav #next{width:34px;padding:6px 0;font-size:1.1rem;line-height:1}
#range{margin-left:8px;font-weight:600;white-space:nowrap}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-text);border-color:var(--chip-on)}
.person{display:flex;align-items:center;gap:6px;color:var(--muted)}
select.sel{border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--text)}
.primary{background:var(--green);color:#fff;border:0;border-radius:6px;padding:7px 16px;font-weight:500}
.primary:hover{background:var(--green-hover)}
.danger{background:transparent;border:1px solid #D9534F;color:#C9302C;border-radius:6px;padding:6px 12px;font-weight:500}
.danger.armed{background:#C9302C;color:#fff}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 20px;color:var(--muted);font-size:.8125rem}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{width:14px;height:4px;border-radius:2px;display:inline-block}
#summary{margin-left:auto;color:var(--text);font-weight:500}
.status{margin:0 20px 8px;padding:8px 12px;border-radius:6px;background:var(--chip);font-size:.8125rem}
main{flex:1;min-height:0;padding:0 20px 20px;display:flex;flex-direction:column}
#view{flex:1;min-height:0;display:flex;flex-direction:column}

/* checks */
.checks{margin-bottom:10px;border:1px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px;font-size:.8125rem}
.checks summary{cursor:pointer;font-weight:600;color:var(--text)}
.checks ul{margin:6px 0 2px;padding-left:18px}
.checks li{margin:2px 0}

/* edit grid */
.scroller{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;font-weight:400;overflow-wrap:anywhere}
thead th{position:sticky;top:0;z-index:3;background:var(--head);color:var(--head-text);border-color:rgba(255,255,255,.12);padding:8px 6px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead th .dow{color:var(--head-muted);font-weight:400}
thead th.today{background:var(--green);color:#fff}
thead th.today .dow{color:#fff}
thead th.mon{border-left:2px solid rgba(255,255,255,.35)}
thead th.corner{left:0;z-index:4;color:var(--head-muted);font-weight:400}
tbody th{position:sticky;left:0;z-index:2;background:var(--surface);color:var(--muted);font-size:.8125rem;font-weight:500}
tbody tr.r-event th,tbody tr.r-event td{border-bottom-color:var(--line-strong)}
tbody tr.r-notes td{font-size:.75rem;color:var(--muted);background:var(--row)}
td.wkend{background:var(--wkend)}
td.today{background:var(--today)}
td.mon{border-left:2px solid var(--line-strong)}
td.empty{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
td.ev{padding-top:10px;cursor:pointer}
td.ev.line-bespoke{box-shadow:inset 0 4px 0 var(--bespoke)}
td.ev.line-own{box-shadow:inset 0 4px 0 var(--own)}
td.ev strong{display:block;font-weight:600;font-size:.9375rem;line-height:1.25}
td.ev .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;font-size:.75rem;color:var(--muted)}
td.rc{font-size:.8125rem}
td.edit{cursor:pointer}
td.edit:hover{outline:2px solid var(--green);outline-offset:-2px}
td.add{padding:4px}
td.add button{width:100%;min-height:34px;border:1px dashed var(--line-strong);background:transparent;border-radius:6px;color:var(--muted);font-size:1.1rem;line-height:1}
td.add button:hover{border-color:var(--green);color:var(--green-ink)}
td.warn{box-shadow:inset 3px 0 0 var(--warn);background:var(--warn-bg)!important}
td.ev.warn{box-shadow:inset 0 4px 0 var(--warn)}
.filtering td.rc:not(.hit),.filtering td.ev:not(.rel){opacity:.35}
td.hit{background:var(--hit)!important;font-weight:600}
.kind{display:inline-block;border-radius:4px;padding:0 6px;font-size:.6875rem;font-weight:500;line-height:1.6;white-space:nowrap}
.k-setup{border:1px solid var(--line-strong)}
.k-event{background:var(--chip-on);color:var(--chip-on-text)}
.k-setup_event{background:var(--chip);border:1px solid var(--line-strong)}
.k-rehearsal,.k-other{background:var(--chip)}

/* present board */
:root{--tint-b:#E3F6EE;--tint-b-ink:#0F5E44;--tint-o:#E2EBEF;--tint-o-ink:#2C4D5C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tint-b:#123B33;--tint-b-ink:#9FE8CC;--tint-o:#1D3A4A;--tint-o-ink:#CFE3EC}}
:root[data-theme="dark"]{--tint-b:#123B33;--tint-b-ink:#9FE8CC;--tint-o:#1D3A4A;--tint-o-ink:#CFE3EC}
.boardwrap{flex:1;min-height:0;overflow:auto;overscroll-behavior-x:contain}
.board{display:grid;gap:10px;align-items:start;min-width:100%;font-size:13px}
.board.fs{font-size:16px;gap:14px}
.cards{display:flex;flex-direction:column;gap:8px}
.daycol.two .cards{display:grid;grid-template-columns:1fr 1fr;align-items:start}
.slot{container-type:inline-size;min-width:0}

.board.in-next{animation:inNext .22s ease-out}.board.in-prev{animation:inPrev .22s ease-out}
@keyframes inNext{from{transform:translateX(28px);opacity:.4}}@keyframes inPrev{from{transform:translateX(-28px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.board.in-next,.board.in-prev{animation:none}}
.daycol{display:flex;flex-direction:column;gap:8px;min-width:0}
.dayhead{position:sticky;top:0;z-index:1;background:var(--bg);padding:2px 2px 6px;border-bottom:3px solid var(--line-strong);display:flex;align-items:baseline;gap:6px}
.dayhead.today{border-color:var(--green)}
.dayhead .dw{font-size:.85em;color:var(--muted)}
.dayhead .dd{font-size:1.15em;font-weight:600;line-height:1.2}
.dayhead.today .dw{color:var(--green-ink);font-weight:500}

.free{color:var(--muted);font-size:.85em;padding:4px 2px}
.daynote{font-size:.85em;background:var(--surface);border:1px dashed var(--line-strong);border-radius:6px;padding:4px 8px;color:var(--muted)}
.evc{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .3s}
.evc.dim{opacity:.35}
.evc.flash{box-shadow:0 0 0 3px var(--green)}
.evc .eh{padding:.6em .8em .55em;background:var(--tint-b)}
.evc.own .eh{background:var(--tint-o)}
.evc .ttl{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.15em .8em}
.evc h3{font-size:1.08em;font-weight:600;margin:0;line-height:1.25;color:var(--tint-b-ink)}
.evc.own h3{color:var(--tint-o-ink)}
.evc .mgr{font-size:.85em;color:var(--tint-b-ink);font-weight:600;white-space:nowrap}
.evc.own .mgr{color:var(--tint-o-ink)}
.evc .mgr .l{font-weight:400;margin-right:.3em}
.evc .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:.4em}
.evc .tag{font-size:.75em;font-weight:500;padding:0 .55em;border-radius:4px;background:var(--surface);color:var(--muted);line-height:1.7}
.evc .meta2{display:flex;flex-wrap:wrap;gap:.2em 1em;padding:.5em .8em 0;font-size:.85em;color:var(--muted)}
.evc .meta2 span{display:inline-flex;align-items:center;gap:.35em}
.evc .meta2 svg{width:1.1em;height:1.1em;flex:none}
.evc .link{background:none;border:0;padding:0;color:var(--green-ink);font-weight:500;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
.evc .grp{padding:.3em .8em .45em}
.evc .grp:last-child{padding-bottom:.7em}
.evc .eh + .grp{padding-top:.55em}
.evc .gt{display:flex;align-items:center;gap:.6em;font-size:.75em;color:var(--muted);margin:.2em 0 .1em;font-weight:500}
.evc .gt::after{content:"";flex:1;height:1px;background:var(--line)}
.evc .rr{display:grid;grid-template-columns:7.6em minmax(0,1fr);gap:.4em;align-items:baseline;margin:.3em 0}
.strip{padding:.35em .8em .6em;background:var(--row);border-top:1px dashed var(--line-strong)}
.strip .sl{display:inline-flex;align-items:center;gap:.3em;font-weight:600;color:var(--muted);margin-right:.2em}
.strip .sl svg{width:1.05em;height:1.05em}
.strip .van{display:inline-flex;align-items:center;gap:.35em;color:var(--muted);margin-left:.4em;white-space:nowrap}
.strip .ppl{gap:3px}
.whoami{max-width:440px;margin:48px auto 0;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:10px}
.whoami h2{margin:0;font-size:1.3rem;font-weight:600}
.whoami p{margin:0}
.whoami select{font-size:1rem;padding:10px;margin-top:6px}
.evc .rl{font-size:.92em;color:var(--muted)}
.ppl{display:flex;flex-wrap:wrap;gap:3px}
.pc{display:inline-flex;align-items:center;font-size:.92em;font-weight:500;padding:0 .45em;border-radius:4px;white-space:nowrap;line-height:1.55}
.pc.me,.sc.me{box-shadow:0 0 0 2px var(--green)}
.sc{display:inline-flex;align-items:center;font-size:.92em;padding:0 .45em;border-radius:4px;border:1px dashed var(--line-strong);color:var(--muted);white-space:nowrap;line-height:1.6}
.tv{font-size:.92em;font-weight:500}
.evc .enotes{font-size:.85em;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);padding:.5em .8em .6em}
.evc .none{padding:.5em .8em .7em;font-size:.85em;color:var(--muted)}
.evc.su{border-style:dashed;border-color:var(--line-strong)}
.evc.su .eh{background:var(--row)}
.evc.su h3,.evc.su .mgr{color:var(--text)}
.c0{background:#E1F5EE;color:#085041}.c1{background:#EEEDFE;color:#3C3489}.c2{background:#FAECE7;color:#712B13}.c3{background:#E6F1FB;color:#0C447C}.c4{background:#FBEAF0;color:#72243E}.c5{background:#FAEEDA;color:#633806}.c6{background:#EAF3DE;color:#27500A}.c7{background:#F1EFE8;color:#444441}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c0{background:#085041;color:#9FE1CB}:root:not([data-theme="light"]) .c1{background:#3C3489;color:#CECBF6}:root:not([data-theme="light"]) .c2{background:#712B13;color:#F5C4B3}:root:not([data-theme="light"]) .c3{background:#0C447C;color:#B5D4F4}:root:not([data-theme="light"]) .c4{background:#72243E;color:#F4C0D1}:root:not([data-theme="light"]) .c5{background:#633806;color:#FAC775}:root:not([data-theme="light"]) .c6{background:#27500A;color:#C0DD97}:root:not([data-theme="light"]) .c7{background:#444441;color:#D3D1C7}}
:root[data-theme="dark"] .c0{background:#085041;color:#9FE1CB}:root[data-theme="dark"] .c1{background:#3C3489;color:#CECBF6}:root[data-theme="dark"] .c2{background:#712B13;color:#F5C4B3}:root[data-theme="dark"] .c3{background:#0C447C;color:#B5D4F4}:root[data-theme="dark"] .c4{background:#72243E;color:#F4C0D1}:root[data-theme="dark"] .c5{background:#633806;color:#FAC775}:root[data-theme="dark"] .c6{background:#27500A;color:#C0DD97}:root[data-theme="dark"] .c7{background:#444441;color:#D3D1C7}
.emptyweek{padding:48px 20px;text-align:center;color:var(--muted)}
td.na{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}

@media (max-width:700px){
  .top{gap:8px;padding:10px 12px}
  .brand h1{font-size:1rem}
  #span,#fsBtn,#mode,.bar{display:none!important}
  .controls{width:100%;gap:8px}
  .nav{width:100%}
  #range{margin-left:auto;font-size:.875rem}
  .person{width:100%}
  .person span{display:none}
  .person select{flex:1}
  .board{align-items:stretch}
  .dayhead{flex-direction:row}
}
/* my schedule */
.mine{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;overflow:auto;padding-bottom:20px}
.mine-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.mine-top h2{font-size:1.1rem;margin:0 auto 0 0;font-weight:600}
.mgroup h3{font-size:.9375rem;margin:0 0 8px;font-weight:600}
.mgroup h3 span{color:var(--muted);font-weight:400}
.mcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--bespoke);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.mcard.own{border-left-color:var(--own)}
.mcard .top2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.mcard strong{font-size:1rem}
.mcard .sub{color:var(--muted);font-size:.8125rem}
.mcard .roles{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.rolepill{background:var(--hit);border-radius:999px;padding:2px 10px;font-size:.8125rem;font-weight:500}
.mcard .em{margin-top:6px;font-size:.8125rem;color:var(--muted)}

/* popover + panel */
.pop{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px;max-height:min(70vh,520px);overflow:auto}
.pop-h{display:flex;flex-direction:column}
.pop-h span{color:var(--muted);font-size:.75rem}
.pop-f{display:flex;justify-content:flex-end;gap:8px}
input[type=text],input[type=date],textarea,.panel select{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.8125rem}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-text)}
.pick-t{font-size:.75rem;color:var(--muted);margin:2px 0 4px}
.hint{color:var(--muted);font-size:.8125rem}
.scrim{position:fixed;inset:0;background:rgba(15,30,40,.35);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);z-index:21;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.panel header h2{font-size:1.125rem;font-weight:600;margin:0;margin-right:auto}
.panel .body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.panel footer{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}
.panel footer .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:.8125rem;font-weight:500;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.card summary::-webkit-details-marker{display:none}
.card summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.card[open] summary::before{transform:rotate(90deg)}
.card summary .hint{font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dayrow-actions{display:flex;flex-wrap:wrap;gap:6px}
.dayrow-actions button{font-size:.8125rem;padding:4px 10px}
.rgrid{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rline{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:start}
.rline>label,.rline>span.l{font-size:.8125rem;color:var(--muted);padding-top:4px}
.rval{display:flex;flex-direction:column;gap:6px}
.rval .cur{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.linkbtn{background:none;border:0;color:var(--green-ink);font-weight:500;padding:2px 0;font-size:.8125rem}
.rolerow{display:grid;grid-template-columns:1fr 100px 150px auto;gap:6px;align-items:center}
.rolerow .opts{grid-column:1 / -1}
.icon{border:1px solid var(--line-strong);background:transparent;border-radius:6px;width:30px;height:30px;padding:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--head);color:#fff;padding:8px 10px 8px 14px;border-radius:6px;font-size:.8125rem;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:4px;padding:2px 10px;font-weight:500}

/* fullscreen: hide chrome that isn't needed on a big screen */
:fullscreen .top .brand h1{font-size:1.4rem}
:fullscreen .hide-fs{display:none!important}

@media (max-width:700px){
  .top{padding:10px 12px}
  .bar{padding-left:12px;padding-right:12px}
  main{padding:0 12px 12px}
  .brand img{height:26px}
  .grid2{grid-template-columns:1fr}
  .rline{grid-template-columns:1fr}
  .board{display:flex;flex-direction:column;min-width:0}
  .daycol.quiet{display:none}
  .dayhead{flex-direction:row;gap:8px;align-items:baseline}
}
@media (prefers-reduced-motion:no-preference){.panel:not([hidden]){animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

.tgrid{display:grid;gap:0 10px;align-items:start;min-width:100%;font-size:13px}
.tgrid.fs{font-size:16px}
.tgrid.in-next{animation:inNext .22s ease-out}.tgrid.in-prev{animation:inPrev .22s ease-out}
.tgrid .dayhead{z-index:7}
.tcorner{position:sticky;top:0;z-index:7;background:var(--bg);align-self:stretch}
.alllbl{font-size:11px;color:var(--muted);text-align:right;padding:8px 4px 0 0}
.allday{display:flex;flex-direction:column;gap:6px;padding:6px 0 10px}
.allday .free{padding:2px}
.daynote.empty{border-style:dashed;color:var(--muted);background:transparent}
.daynote.edit{cursor:pointer}
.taxis{position:relative}
.taxis span{position:absolute;right:4px;font-size:11px;color:var(--muted);transform:translateY(-7px)}
.tday{position:relative;border-left:1px solid var(--line)}
.tday.today{background:color-mix(in srgb,var(--today) 45%,transparent)}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.nowline{position:absolute;left:-4px;right:0;border-top:2px solid var(--green);z-index:4}
.tslot{position:absolute;z-index:1}
.tslot>.evc{height:100%;overflow:hidden}
.tslot>.evc{cursor:pointer}
.evc .sum{display:none;padding:.35em .8em .5em}
.evc.compact .grp,.evc.compact .strip,.evc.compact .enotes,.evc.compact .none{display:none}
.evc.compact .sum{display:block}
.evc.mini .grp,.evc.mini .strip,.evc.mini .enotes,.evc.mini .none,.evc.mini .sum,.evc.mini .meta2,.evc.mini .tags{display:none}
.evc.mini .eh{padding:.3em .6em}
.evc.mini .eh::after{content:attr(data-t);display:block;font-size:.8em;color:var(--muted)}
.dayjump{background:none;border:0;padding:0;font:inherit;color:inherit;display:flex;align-items:baseline;gap:6px;cursor:pointer;text-align:left}
.dayjump:hover .dd{text-decoration:underline}
#dayPick{width:auto;margin-left:8px;border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;background:var(--surface)}
.evc{border-left:4px solid var(--bespoke)}
.evc.own{border-left-color:var(--own)}
.evc.su{border-left:4px dashed var(--line-strong)}
.tslot>.evc{box-shadow:0 1px 3px rgba(0,0,0,.22)}
.tag.van{border:1px solid var(--line-strong);color:var(--text)}
.tag.vantog{border:1px dashed var(--line-strong);cursor:pointer;font-family:inherit;font-size:.75em}
.tag.vantog.on{border-style:solid;color:var(--text)}
.tag.warn{background:var(--warn-bg)!important;color:var(--warn)!important;border-color:var(--warn)!important}
.chk{display:flex;align-items:center;gap:6px;font-size:.875rem}
body.dragging .tslot{height:var(--h)!important;min-height:0!important;z-index:1}
body.dragging .tslot>.evc{height:100%!important;min-height:0!important;box-shadow:none!important}
body.dragging .tslot>.evc.over{z-index:2}
.tslot .evc .eh{padding:.4em .7em .35em}
.teambar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 10px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:13px}
.teambar .tl{font-size:12px;color:var(--muted);margin:0 4px 0 6px}
.teambar .tl:first-child{margin-left:0}
.teambar .hrs{font-weight:400;margin-left:.4em;font-size:.85em}
.teambar.over{outline:2px dashed var(--warn);outline-offset:2px}
[data-drag]{cursor:grab}
.dz.over,.evc.over{outline:2px solid var(--green);outline-offset:-2px;background:var(--hit)}
.dropph{white-space:nowrap;color:var(--muted);font-size:.85em;border:1px dashed var(--line-strong);border-radius:4px;padding:0 .5em;line-height:1.6}
.pc.warn,.sc.warn{background:var(--warn-bg)!important;color:var(--warn)!important;box-shadow:inset 0 0 0 1px var(--warn)}
.rr.edit{cursor:pointer;border-radius:4px;margin-left:-.3em;margin-right:-.3em;padding:0 .3em}
.rr.edit:hover{background:var(--row)}
.evc .mgr.dz{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px;border-radius:4px;padding:0 2px}
.evc .eh .open{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.evc .eh .open:hover{text-decoration:underline}
.dayadd{margin-left:auto;background:none;border:1px dashed var(--line-strong);border-radius:4px;color:var(--muted);font-size:.8em;padding:0 .5em;line-height:1.7}
.dayadd:hover{border-color:var(--green);color:var(--green-ink)}
.edittop{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.edittop .checks{flex:1;margin:0;padding:6px 12px}
.times{display:flex;align-items:center;gap:6px}
input[type=time]{border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;background:var(--surface);flex:1;min-width:0}
</style>
</head>

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const fmtDay=s=>{const d=parse(s);return DOW[(d.getDay()+6)%7]+' '+d.getDate()+' '+MON[d.getMonth()]};
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const cfg=()=>S.config||{team:[],suppliers:[],roles:[]};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e}
function ico(svg){const s=document.createElement('span');s.innerHTML=svg;return s.firstChild}
const asList=v=>v==null?[]:Array.isArray(v)?v:[v];
const valText=v=>v==null?'':Array.isArray(v)?v.join(', '):String(v);
function hasPerson(v,p){if(!p||v==null)return false;const low=p.toLowerCase();if(Array.isArray(v))return v.some(x=>String(x).toLowerCase()===low);return String(v).toLowerCase().split(/\s*(?:\/|,|&|\+|\band\b)\s*/).includes(low)}
const sortedDays=ev=>[...(ev.days||[])].sort((a,b)=>a.date.localeCompare(b.date)||(KIND_RANK[a.kind]??3)-(KIND_RANK[b.kind]??3));
const isSetup=d=>d.kind==='setup';
const isEventDay=d=>d.kind==='event'||d.kind==='setup_event';
const groupOf=r=>{const g=r.group||DEF_GROUP[r.id]||'other';return GROUP_LABEL[g]?g:'other'};
function applies(role,day){if(day.kind==='setup_event')return true;const setupRole=role.id!=='type'&&groupOf(role)==='setup';return isSetup(day)?setupRole:!setupRole}
function managerOf(ev){if(Array.isArray(ev.manager))return ev.manager;const out=[];(ev.days||[]).forEach(d=>asList((d.roles||{}).em).forEach(n=>{if(!out.includes(n))out.push(n)}));return out}
const fmtHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const fmtMin=m=>Math.floor(m/60)+':'+pad(m%60);
const toMin=t=>{const m=String(t||'').match(/^(\d{1,2})[:h.](\d{2})$/);return m?(+m[1])*60+(+m[2]):null};
const TIME_RE=/(\d{1,2})[:h.](\d{2})/g;
function timesOf(d){let s=toMin(d.start),e=toMin(d.end);if(s==null&&!d.start&&d.time){const all=[...String(d.time).matchAll(TIME_RE)].map(m=>(+m[1])*60+(+m[2]));if(all.length){s=all[0];if(all.length>1)e=all[1]}}if(s!=null&&e!=null&&e<=s)e=null;return{s,e}}
function noteOf(d){if(d.start)return d.time||'';return String(d.time||'').replace(/(from\s*)?\d{1,2}[:h.]\d{2}/gi,'').replace(/^[\s,–-]+|[\s,–-]+$/g,'').trim()}
function timeLabel(d){const{s,e}=timesOf(d);const t=s==null?'':(e!=null?fmtMin(s)+'–'+fmtMin(e):'From '+fmtMin(s));return[t,noteOf(d)].filter(Boolean).join(', ')}
const spanOf=d=>{const{s,e}=timesOf(d);return s==null?[0,1440]:[s,e??s+60]};
const dayRel=(ev,day,p)=>!!p&&(Object.values(day.roles||{}).some(v=>hasPerson(v,p))||(isEventDay(day)&&hasPerson(managerOf(ev),p)));
function status(msg){const s=$('#status');s.textContent=msg||'';s.hidden=!msg}
function toast(msg,undo){const t=$('#toast');t.textContent='';t.append(h('span',null,msg));if(undo)t.append(h('button',{type:'button',onclick:()=>{t.hidden=true;doUndo()}},'Undo'));t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,undo?6000:3500)}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('qed-sched2')||'{}');if(['present','mine','edit'].includes(p.mode))S.mode=p.mode;if(p.span&&typeof p.span==='object'){for(const m of['present','edit'])if(SPANS[m].includes(p.span[m]))S.span[m]=p.span[m]}if(typeof p.person==='string')S.person=p.person;if(typeof p.me==='string')S.me=p.me;if(p.editView==='table')S.editView='table'}catch(e){}}
function savePrefs(){try{localStorage.setItem('qed-sched2',JSON.stringify({mode:S.mode,span:S.span,person:S.person,me:S.me,editView:S.editView||'board'}))}catch(e){}}

/* ---------- data + undo ---------- */
const queues={};
function errText(e){const c=e&&e.code;if(c==='invalid_argument')return'This change wasn’t saved: you have view access only.';if(c==='quota_exceeded')return'Storage is full. Delete old events to free space.';if(c==='resource_exhausted')return'Too many changes at once. Wait a moment and try again.';return'Change not saved. Check your connection and try again.'}
function write(path,data){const run=()=>data==null?S.db.doc(path).delete():S.db.doc(path).set(data);const p=(queues[path]||Promise.resolve()).then(run).catch(e=>{if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(run).catch(x=>toast(errText(x)));toast(errText(e))});queues[path]=p;return p}
function currentAt(path){const[col,id]=path.split('/');if(col==='events'){const e=S.events.find(x=>x.id===id);if(!e)return null;const b=clone(e);delete b.id;return b}if(col==='notes')return clone(S.notes[id])||null;if(col==='config')return clone(S.config)||null;return null}
function applyLocal(path,data){const[col,id]=path.split('/');if(col==='events'){S.events=S.events.filter(e=>e.id!==id);if(data)S.events.push({...clone(data),id})}else if(col==='notes'){if(data)S.notes[id]=clone(data);else delete S.notes[id]}else if(col==='config')S.config=clone(data)}
function commitMulti(changes,label){S.history.push({multi:changes.map(c=>({path:c.path,before:currentAt(c.path)})),label});if(S.history.length>60)S.history.shift();changes.forEach(c=>applyLocal(c.path,c.data));render();changes.forEach(c=>write(c.path,c.data==null?null:c.data));updateUndo();if(label)toast(label,true)}
function commit(path,data,label){commitMulti([{path,data}],label)}
function doUndo(){const last=S.history.pop();updateUndo();if(!last){toast('Nothing to undo');return}const list=last.multi||[{path:last.path,before:last.before}];list.forEach(x=>applyLocal(x.path,x.before));render();list.forEach(x=>write(x.path,x.before));toast('Undone: '+(last.label||'last change'))}
function updateUndo(){$('#undoBtn').disabled=!S.history.length}
function prepBody(ev){const body=clone(ev);delete body.id;body.manager=managerOf(body);body.days.forEach(d=>{if(d.roles)delete d.roles.em});body.days.sort((a,b)=>a.date.localeCompare(b.date)||(KIND_RANK[a.kind]??3)-(KIND_RANK[b.kind]??3));body.updatedAt=Date.now();return body}
function saveEvent(ev,label){commit('events/'+ev.id,prepBody(ev),label||'Saved')}

/* ---------- checks ---------- */
function runChecks(dates,by){
  const c=cfg();const team=new Set(c.team||[]);const peopleRoles=(c.roles||[]).filter(r=>r.kind==='people'&&true);
  
  const issues=[];const cells=new Set();const heads=new Set();const seen=new Set();
  const ov=(a,b)=>{const A=spanOf(a),B=spanOf(b);return A[0]<B[1]&&B[0]<A[1]};
  const when=(a,b)=>timesOf(a).s!=null&&timesOf(b).s!=null?'at the same time':'on the same day (times not set)';
  for(const k of dates){const items=by[k]||[];
    if(items.length>1){
      const who={};
      for(const it of items)for(const r of peopleRoles)for(const n of asList((it.day.roles||{})[r.id])){if(!team.has(n))continue;(who[n]=who[n]||[]).push({it,rid:r.id})}
      for(const[n,list]of Object.entries(who)){const pairs=new Map();
        for(let x=0;x<list.length;x++)for(let y=x+1;y<list.length;y++){const a=list[x],b=list[y];if(a.it.ev.id===b.it.ev.id||!ov(a.it.day,b.it.day))continue;
          for(const q of[a,b]){cells.add(q.it.ev.id+'|'+q.it.day.id+'|'+q.rid);cells.add(q.it.ev.id+'|'+q.it.day.id+'|'+q.rid+'|'+n)}
          pairs.set([a.it.ev.name,b.it.ev.name].sort().join(' and '),when(a.it.day,b.it.day))}
        pairs.forEach((w,pn)=>issues.push(fmtDay(k)+': '+n+' is on '+pn+' '+w))}
    }
    for(const it of items){if(seen.has(it.ev.id)||!isEventDay(it.day))continue;seen.add(it.ev.id);
      if(!managerOf(it.ev).length){issues.push(it.ev.name+' has no event manager');heads.add(it.ev.id+'|mgr')}
      if(!(it.ev.days||[]).some(isSetup)){issues.push(it.ev.name+' has no set-up planned');heads.add(it.ev.id+'|setup')}}
  }
  for(const k of dates){const vans=(by[k]||[]).filter(it=>it.day.van);
    for(let x=0;x<vans.length;x++)for(let y=x+1;y<vans.length;y++){const a=vans[x],b=vans[y];if(a.ev.id===b.ev.id)continue;const A=spanOf(a.day),B=spanOf(b.day);if(!(A[0]<B[1]&&B[0]<A[1]))continue;
      issues.push(fmtDay(k)+': van needed for '+a.ev.name+(isSetup(a.day)?' set-up':'')+' and '+b.ev.name+(isSetup(b.day)?' set-up':'')+(timesOf(a.day).s!=null&&timesOf(b.day).s!=null?' at the same time':' on the same day (times not set)'));cells.add(a.ev.id+'|'+a.day.id+'|van');cells.add(b.ev.id+'|'+b.day.id+'|van')}}
  const noTime=[...new Set(dates.flatMap(k=>(by[k]||[]).filter(it=>timesOf(it.day).s==null).map(it=>it.ev.name+(isSetup(it.day)?' set-up':''))))];
  if(noTime.length)issues.push('No times yet (click the event to add them): '+noTime.join(', '));
  return{issues,cells,heads};
}

/* ---------- range ---------- */
function rangeInfo(){const span=S.span[S.mode]||7;const cols=[];for(let i=0;i<span;i++){const d=addDays(S.start,i);cols.push({d,k:iso(d)})}
  const by={};for(const ev of S.events)for(const d of ev.days||[])(by[d.date]||(by[d.date]=[])).push({ev,day:d});
  for(const k in by)by[k].sort((a,b)=>(a.ev.name||'').localeCompare(b.ev.name||'')||(KIND_RANK[a.day.kind]??3)-(KIND_RANK[b.day.kind]??3)||((timesOf(a.day).s??9999)-(timesOf(b.day).s??9999)));
  cols.forEach(c=>c.items=by[c.k]||[]);return{cols,by,end:addDays(S.start,span-1)}}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===S.mode)));
  document.querySelectorAll('[data-for]').forEach(el=>{let show=el.dataset.for.split(' ').includes(S.mode);if(el.id==='fsBtn')show=show&&!!document.fullscreenEnabled;if(['addEvent','undoBtn','settingsBtn'].includes(el.id))show=show&&S.owner;el.hidden=!show});
  const seg=$('#span');seg.textContent='';(SPANS[S.mode]||[]).forEach(n=>seg.append(h('button',{type:'button','aria-pressed':String(S.span[S.mode]===n),onclick:()=>{const wasDay=isDayView();const t=new Date();const inRange=iso(t)>=iso(S.start)&&iso(t)<=iso(addDays(S.start,(S.span[S.mode]||7)-1));S.span[S.mode]=n;S.start=n===1?(wasDay?S.start:(inRange?new Date(t.getFullYear(),t.getMonth(),t.getDate()):S.start)):mondayOf(S.start);savePrefs();render()}},n===1?'1 day':n===7?'1 week':n/7+' weeks')));
  $('#mode').textContent=S.mode==='edit'?'Drag people onto events (hold Alt to copy). Click a role to edit it. Changes are live and can be undone.':S.mode==='present'?(isDayView()?'Pick another day with the date field or the arrows. Click a card for details.':'Click a day to open it on its own. Click a card for details.'):'';
  $('#fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen';
  fillPersonSelect();
  const v=$('#view');v.textContent='';$('#summary').textContent='';
  if(S.mode==='mine'){renderMine(v);return}
  const R=rangeInfo();
  $('#dayPick').hidden=!isDayView();$('#dayPick').value=iso(S.start);$('#range').textContent=isDayView()?DOWL[(S.start.getDay()+6)%7]+' '+S.start.getDate()+' '+MON[S.start.getMonth()]+' '+S.start.getFullYear():S.start.getDate()+(S.start.getMonth()!==R.end.getMonth()?' '+MON[S.start.getMonth()]:'')+' – '+R.end.getDate()+' '+MON[R.end.getMonth()]+' '+R.end.getFullYear();
  const narrow=innerWidth<700;
  if(S.mode==='edit'){if(!narrow)v.append(h('div',{class:'edittop'},editToggle()));if(narrow||S.editView==='table')renderEdit(v,R);else renderBoard(v,R,true)}
  else if(narrow)renderPresent(v,R);else renderBoard(v,R,false);
  if(S.person){let n=0;const days=new Set();for(const col of R.cols)for(const it of col.items){let k=Object.values(it.day.roles||{}).filter(x=>hasPerson(x,S.person)).length;if(isEventDay(it.day)&&hasPerson(managerOf(it.ev),S.person))k++;if(k){n+=k;days.add(col.k)}}
    $('#summary').textContent=S.person+': '+n+' assignment'+(n===1?'':'s')+' over '+days.size+' day'+(days.size===1?'':'s')}
}
function fillPersonSelect(){const c=cfg();const sel=$('#person');const names=[...(c.team||[]),...(c.suppliers||[])];const want=JSON.stringify(names);
  if(sel.dataset.names!==want){sel.textContent='';sel.append(h('option',{value:''},'Everyone'));if((c.team||[]).length){const g=h('optgroup',{label:'Team'});c.team.forEach(n=>g.append(h('option',{value:n},n)));sel.append(g)}if((c.suppliers||[]).length){const g=h('optgroup',{label:'Suppliers'});c.suppliers.forEach(n=>g.append(h('option',{value:n},n)));sel.append(g)}sel.dataset.names=want}
  sel.value=names.includes(S.person)?S.person:'';}

/* present */
function personChip(n){const team=cfg().team||[];const ti=team.findIndex(x=>x.toLowerCase()===n.toLowerCase());const me=!!S.person&&n.toLowerCase()===S.person.toLowerCase();
  return h('span',{class:(ti<0?'sc':'pc c'+(ti%8))+(me?' me':'')},n)}
function peopleList(v){return h('div',{class:'ppl'},asList(v).map(n=>personChip(String(n))))}
function jumpTo(evId,dayId){const ev=S.events.find(e=>e.id===evId);const day=ev&&ev.days.find(d=>d.id===dayId);if(!day)return;
  const flash=()=>{const el=document.querySelector('[data-card="'+evId+'|'+dayId+'"]');if(el){el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}};
  const dt=parse(day.date);if(dt<S.start||dt>addDays(S.start,S.span[S.mode]-1)){S.anim=dt<S.start?'in-prev':'in-next';S.start=startFor(dt);render();setTimeout(flash,60)}else flash()}
function sameSet(a,b){return asList(a).map(String).sort().join('|')===asList(b).map(String).sort().join('|')}
function joinLabels(ls){if(ls.length===1)return ls[0];const last=ls.map(l=>l.split(' ').pop());
  const parts=(ls.every(l=>l.includes(' '))&&last.every(w=>w===last[0])?ls.map(l=>l.slice(0,l.lastIndexOf(' '))):ls).map((x,i)=>i?x.toLowerCase():x);
  return parts.length===2?parts.join(' & '):parts.slice(0,-1).join(', ')+' & '+parts[parts.length-1]}
function mergeRows(list){const out=[];for(const x of list){const prev=out[out.length-1];
  if(prev&&x.r.kind==='people'&&prev.r.kind==='people'&&sameSet(prev.v,x.v))prev.labels.push(x.r.label);else out.push({r:x.r,v:x.v,labels:[x.r.label]})}
  const peopleCount=list.filter(x=>x.r.kind==='people').length;
  return out.map(o=>({...o,label:o.labels.length>2&&o.labels.length===peopleCount?'All roles':joinLabels(o.labels)}))}
function dragChip(n,evId,dayId,roleId,warn){const c=personChip(n);c.setAttribute('draggable','true');c.dataset.drag='1';c.dataset.p=n;if(evId){c.dataset.ev=evId;c.dataset.day=dayId;c.dataset.role=roleId}if(warn)c.classList.add('warn');return c}
function editRow(ed,day,role,lbl){const v=(day.roles||{})[role.id];const people=role.kind==='people';
  const val=people?h('div',{class:'ppl'},asList(v).length?asList(v).map(n=>dragChip(String(n),ed.ev.id,day.id,role.id,ed.cells.has(ed.ev.id+'|'+day.id+'|'+role.id+'|'+n))):h('span',{class:'dropph'},'Drop here')):h('div',{class:'tv'},valText(v)||'–');
  const row=h('div',{class:'rr edit'+(people?' dz':''),'data-ev':ed.ev.id,'data-day':day.id,'data-role':role.id,tabindex:0,title:'Click to edit'},h('span',{class:'rl'},lbl),val);
  const open=()=>openCellEditor(row,ed.ev.id,day.id,role);row.addEventListener('click',open);row.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();open()}});return row}
function rolesSections(card,day,setupCard,ed){
  const c=cfg();const roles=day.roles||{};const groups={};
  for(const r of c.roles||[]){if(r.id==='type'||r.id==='em'||!applies(r,day))continue;const v=roles[r.id];const empty=v==null||v===''||(Array.isArray(v)&&!v.length);if(empty&&!ed)continue;(groups[groupOf(r)]||(groups[groupOf(r)]=[])).push({r,v})}
  let any=false;const used=GROUPS.filter(([g])=>groups[g]);
  for(const[g,label]of used){any=true;
    const sec=h('section',{class:'grp'},setupCard||used.length===1&&g!=='other'?null:h('p',{class:'gt'},label));
    const rows=ed?groups[g].map(x=>({r:x.r,v:x.v,labels:[x.r.label],label:x.r.label})):mergeRows(groups[g]);
    for(const row of rows){const lbl=setupCard&&row.r.id==='setupteam'&&row.labels.length===1?'Team':(g==='tech'?row.label.replace(/\s+operators?$/i,''):row.label);
      sec.append(ed?editRow(ed,day,row.r,lbl):h('div',{class:'rr'},h('span',{class:'rl'},lbl),row.r.kind==='people'?peopleList(row.v):h('div',{class:'tv'},valText(row.v))))}
    card.append(sec)}
  if(!any)card.append(h('div',{class:'none'},setupCard?'Set-up team not assigned yet':'Team not assigned yet'));
}
function vanTag(ev,day,ed){const warn=!!ed&&!!ev&&ed.cells.has(ev.id+'|'+day.id+'|van');
  if(ed&&ev){const b=h('button',{type:'button',class:'tag vantog'+(day.van?' on':'')+(warn?' warn':''),'aria-pressed':String(!!day.van),title:day.van?'Van needed. Click to remove':'Click if the van is needed'},day.van?'Van needed':'+ Van');
    b.addEventListener('click',e=>{e.stopPropagation();const next=clone(findEv(ev.id));const d=next.days.find(x=>x.id===day.id);if(!d)return;if(d.van)delete d.van;else d.van=true;saveEvent(next,(d.van?'Van needed for ':'Van removed from ')+next.name)});return b}
  return day.van?h('span',{class:'tag van'},'Van needed'):null}
function setupStrip(su,ed){

let popCommit=null;
function openPop(anchor,build){closePop(true);const p=$('#pop');p.textContent='';p.hidden=false;popCommit=build(p);place(p,anchor);setTimeout(()=>{const f=p.querySelector('input')||p.querySelector('button.chip,button.primary');f&&f.focus()},0)}
function place(p,a){const r=a.getBoundingClientRect();const w=Math.min(340,innerWidth-16);p.style.width=w+'px';p.style.left=Math.min(Math.max(8,r.left),innerWidth-w-8)+'px';const ph=p.offsetHeight;let y=r.bottom+6;if(y+ph>innerHeight-8)y=Math.max(8,r.top-ph-6);p.style.top=y+'px'}

function peoplePicker(initial,onChange){
  let sel=[...initial];const c=cfg();
  const chips=h('div',{class:'chips'}),pick=h('div');
  const other=h('input',{type:'text',placeholder:'Someone else (e.g. Venue, NA), then Enter'});
  const changed=()=>{draw();onChange&&onChange(sel.slice())};
  const toggle=n=>{sel=sel.includes(n)?sel.filter(x=>x!==n):[...sel,n];changed()};
  function draw(){chips.textContent='';if(!sel.length)chips.append(h('span',{class:'hint'},'Nobody assigned'));sel.forEach(n=>{const b=h('button',{type:'button',class:'chip on','aria-label':'Remove '+n},n+' ×');b.addEventListener('click',()=>toggle(n));chips.append(b)});
    pick.textContent='';for(const[title,list]of[['Team',c.team||[]],['Suppliers',c.suppliers||[]]]){if(!list.length)continue;pick.append(h('div',{class:'pick-t'},title));const g=h('div',{class:'chips'});list.forEach(n=>g.append(h('button',{type:'button',class:'chip'+(sel.includes(n)?' on':''),'aria-pressed':String(sel.includes(n)),onclick:()=>toggle(n)},n)));pick.append(g)}}
  other.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=other.value.trim();if(v&&!sel.includes(v))sel.push(v);other.value='';changed()}});
  draw();
  return{nodes:[chips,pick,other],get:()=>{const v=other.value.trim();if(v&&!sel.includes(v)){sel.push(v);other.value=''}return sel.slice()}};
}
function choicePicker(role,cur,onChange){let v=cur||'';const g=h('div',{class:'chips'});const dr=()=>{g.textContent='';(role.options||[]).forEach(o=>g.append(h('button',{type:'button',class:'chip'+(v===o?' on':''),'aria-pressed':String(v===o),onclick:()=>{v=v===o?'':o;dr();onChange&&onChange(v||null)}},o)))};dr();return{nodes:[g],get:()=>v||null}}

function openCellEditor(td,evId,dayId,role){
  openPop(td,p=>{
    const ev=findEv(evId);const day=ev.days.find(d=>d.id===dayId);const isMgr=role.id===MANAGER.id;const cur=isMgr?managerOf(ev):(day.roles||{})[role.id];
    p.append(h('div',{class:'pop-h'},h('strong',null,role.label),h('span',null,isMgr?ev.name+' (whole event)':ev.name+', '+fmtDay(day.date))));
    let get;
    if(role.kind==='people'){const pp=peoplePicker(asList(cur).map(String));p.append(...pp.nodes);get=()=>{const v=pp.get();return v.length?v:null}}
    else if(role.kind==='choice'){const cp=choicePicker(role,cur);p.append(...cp.nodes);get=cp.get}
    else{const inp=h('input',{type:'text',value:valText(cur)});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();closePop(true)}});p.append(inp);get=()=>inp.value.trim()||null}
    p.append(popFooter());
    return()=>{const v=get();const now=findEv(evId);if(!now)return;const next=clone(now);
      if(isMgr){if(JSON.stringify(v||[])===JSON.stringify(managerOf(now)))return;next.manager=v||[];saveEvent(next,'Event manager updated for '+now.name);return}
      const d=next.days.find(x=>x.id===dayId);if(!d)return;if(JSON.stringify(v)===JSON.stringify((d.roles||{})[role.id]??null))return;d.roles=d.roles||{};if(v==null)delete d.roles[role.id];else d.roles[role.id]=v;saveEvent(next,role.label+' updated for '+now.name)};

function openEventPanel(evId,date,preset){
  if(!S.owner)return;
  const c=cfg();const isNew=!evId;const src=isNew?null:findEv(evId);if(!isNew&&!src)return;
  const d0=date||iso(new Date());
  const ev=preset||(isNew?{id:null,name:'',line:'bespoke',notes:'',manager:[],days:[{id:uid(),date:d0,kind:'setup',time:'',venue:'',roles:{}},{id:uid(),date:d0,kind:'event',time:'',venue:'',roles:{}}]}:clone(src));

    const et=h('input',{type:'time',value:d.end||'','aria-label':'End time'});et.addEventListener('input',()=>d.end=et.value||null);
    const ti=h('input',{type:'text',value:d.time||'',placeholder:'Note, e.g. 2 sessions','aria-label':'Time note'});ti.addEventListener('input',()=>d.time=ti.value);
    const vi=h('input',{type:'text',value:d.venue||'',placeholder:'Venue',list:'venues','aria-label':'Venue'});vi.addEventListener('input',()=>d.venue=vi.value);

    if(ev.days.length>1)acts.append(h('button',{type:'button',class:'ghost',onclick:()=>{ev.days.splice(i,1);drawDays()}},'Remove this day'));
    const det=h('details',{class:'card'},h('summary',null,sumTxt,h('span',{class:'hint'},rolesCount(d))),
      h('div',{class:'grid2'},di,ki,h('div',{class:'times'},st,h('span',{class:'hint'},'to'),et),vi,ti,h('label',{class:'chk'},vb,'Van needed')),

    det.open=openId?openId===d.id:(ev.days.length<=3||i<2);
    daysBox.append(det)})}
  drawDays();

  footer.append(h('span',{class:'spacer'}),h('button',{type:'button',class:'ghost',onclick:closePanel},'Cancel'),h('button',{type:'button',class:'primary',onclick:()=>{

  }},isNew?'Add event':'Save'));
  openPanel(isNew?'New event':'Edit event',body,footer);

    h('label',{class:'field'},h('span',null,'Team (one name per line)'),team),
    h('label',{class:'field'},h('span',null,'Suppliers (one per line)'),sup),
    h('div',{class:'field'},h('span',null,'Roles'),rolesBox,h('div',null,h('button',{type:'button',class:'ghost',onclick:()=>{c.roles.push({id:'r'+uid(),label:'New role',kind:'people',group:'other'});drawRoles()}},'Add role')),
      h('span',{class:'hint'},'Roles in the Set-up team appear on set-up cards. All other roles appear on event days. Event manager is set per event.')));
  const footer=h('footer',null,h('span',{class:'spacer'}),h('button',{type:'button',class:'ghost',onclick:closePanel},'Cancel'),h('button',{type:'button',class:'primary',onclick:()=>{
    const lines=t=>[...new Set(t.value.split('\n').map(s=>s.trim()).filter(Boolean))];
    c.team=lines(team);c.suppliers=lines(sup);c.roles=c.roles.filter(r=>r.label.trim()).map(r=>({...r,label:r.label.trim(),group:groupOf(r)}));
    closePanel();commit('config/main',c,'Settings saved')}},'Save settings'));
  openPanel('Settings',body,footer);
}

/* ---------- navigation ---------- */
const step=()=>isDayView()?1:(S.mode==='present'?7:S.span[S.mode]);
function go(dir){S.anim=dir>0?'in-next':'in-prev';S.start=addDays(S.start,dir*step());closePop(true);render()}
$('#prev').addEventListener('click',()=>go(-1));
$('#next').addEventListener('click',()=>go(1));
$('#today').addEventListener('click',()=>{S.start=startFor(new Date());render()});
$('#dayPick').addEventListener('change',e=>{if(e.target.value){S.start=parse(e.target.value);render()}});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;closePop(true);if(S.mode!=='mine'){const t=new Date();S.start=isDayView()?(iso(t)>=iso(mondayOf(S.start))&&iso(t)<=iso(addDays(mondayOf(S.start),6))?startFor(t):S.start):mondayOf(S.start)}savePrefs();render()}));
$('#person').addEventListener('change',e=>{S.person=e.target.value;savePrefs();render()});
$('#addEvent').addEventListener('click',()=>openEventPanel(null,iso(new Date())));
$('#settingsBtn').addEventListener('click',openSettings);
$('#undoBtn').addEventListener('click',doUndo);
$('#fsBtn').addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('Full screen isn’t available here. Open the artifact on its own page.'))}catch(e){toast('Full screen isn’t available here.')}});
document.addEventListener('fullscreenchange',()=>render());
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#pop').hidden){closePop(false);return}if(!$('#panel').hidden){closePanel();return}}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'');if(typing||!$('#panel').hidden||!$('#pop').hidden)return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&S.owner&&S.mode==='edit'){e.preventDefault();doUndo();return}
  if(S.mode==='mine'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key.toLowerCase()==='t'){S.start=startFor(new Date());render()}
  else if(e.key.toLowerCase()==='f'&&S.mode==='present'&&document.fullscreenEnabled)$('#fsBtn').click();
});
/* swipe changes the period on phones (Schedule view) */
let tx=null,ty=0;
$('#view').addEventListener('touchstart',e=>{if(S.mode!=='present'||e.touches.length!==1){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#view').addEventListener('touchend',e=>{if(tx==null)return;const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
  const w=$('#view .boardwrap');if(w&&w.scrollWidth-w.clientWidth>2)return;
  if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy))go(dx<0?1:-1)},{passive:true});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if($('#pop').hidden)render()},150)});

/* ---------- start ---------- */
loadPrefs();S.start=startFor(new Date());if(S.mode==='edit')S.mode='present';render();
(async()=>{
  let db=null,user=null;
  try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}}catch(e){}
  if(!db){status('The schedule loads when this page is opened in Claude while signed in.');return}
  S.db=db;
  try{S.owner=user?await user.isOwner():false}catch(e){S.owner=false}
  $('.edit-tab').hidden=!S.owner;
  try{const p=JSON.parse(localStorage.getItem('qed-sched2')||'{}');if(S.owner&&p.mode==='edit')S.mode='edit'}catch(e){}
  status('Loading the schedule…');render();
  const timer=setTimeout(()=>{if(!(S.got.config&&S.got.events&&S.got.notes))status('Can’t reach the schedule right now. What you see may be out of date.')},10000);
  const done=(k,meta)=>{S.got[k]=true;if(S.got.config&&S.got.events&&S.got.notes&&!meta.fromCache){clearTimeout(timer);status('')}if($('#pop').hidden)render()};
  const fail=e=>{clearTimeout(timer);status(e&&e.code==='revoked'?'This schedule is no longer available to you.':'The schedule couldn’t be loaded. Reopen the page to try again.')};
  db.doc('config/main').onSnapshot(s=>{S.config=s.exists?s.data():null;done('config',s.metadata)},fail);
  db.collection('events').onSnapshot(s=>{S.events=s.docs.map(d=>({...d.data(),id:d.id}));done('events',s.metadata)},fail);
  db.collection('notes').onSnapshot(s=>{const n={};s.docs.forEach(d=>{const x=d.data();n[x.date||d.id]=x});S.notes=n;done('notes',s.metadata)},fail);
})();
})();
</script>
</body>
</html>
