<head>
<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<title>Poulette HQ</title>
<meta name="theme-color" content="#171819">
<!-- Theme before anything is drawn (no white flash at night): dark unless
     chosen otherwise in Réglages (this device only). -->
<script>
  try {
    var t = localStorage.getItem("poulette.theme");
    if (t === "light") document.documentElement.dataset.theme = "light";
    if (t === "auto") delete document.documentElement.dataset.theme;
  } catch (e) { /* storage blocked: stay dark */ }
</script>
<link rel="icon" href="icons/poulette-hq-icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/poulette-hq-icon-180.png">
