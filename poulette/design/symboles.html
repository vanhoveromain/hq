<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PouletteHQ — symboles</title>
<style>
:root{--bg:#FAFAF9;--surface:#fff;--text:#242424;--muted:#666;--border:#E5E5E3}
@media (prefers-color-scheme:dark){:root{--bg:#171819;--surface:#222426;--text:#F4F4F2;--muted:#ACB0B2;--border:#3B3E40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px} p{margin:0 0 16px;color:var(--muted)}
.opt{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin:16px 0}
.opt h2{font-size:17px;margin:0 0 2px} .opt p{margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.row svg{display:block}
.pair{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.tile{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:8px}
.light{background:#fff;border:1px solid #E5E5E3;color:#242424}.dark{background:#171819;color:#F4F4F2}
.lock{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.lock svg{width:28px;height:28px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.card svg{width:64px;height:64px;border-radius:14px}
</style>
</head>
<body>
<main>
<h1>Poulette HQ — 3 propositions de symbole</h1>
<p>Ambre <code>#94672E</code>, géométrie blanche plate, coins à 8 % (règles de la famille HQ). Tailles : 80, 48, 32, 24, 16 px.</p>
<div id="opts"></div>
</main>
<template id="t">
</template>
<script>
const BG = '<rect width="100" height="100" rx="8" fill="#94672E"/>';
const OPTS = [
  ["1. Œuf", "Une coquille qui protège un point : la vie qui commence. Forme simple, lisible à 16 px.",
   '<path fill="#fff" fill-rule="evenodd" d="M50 13C67 13 80 40 80 59C80 76 67 87 50 87C33 87 20 76 20 59C20 40 33 13 50 13ZM50 24C61 24 70 44 70 59C70 70 62 77 50 77C38 77 30 70 30 59C30 44 39 24 50 24Z"/><circle cx="50" cy="59" r="9" fill="#fff"/>'],
  ["2. Berceau", "Un arc qui porte un cercle : on tient le bébé. Évoque le soin et les bras.",
   '<path fill="#fff" d="M15 47A35 35 0 0 0 85 47L73 47A23 23 0 0 1 27 47Z"/><circle cx="50" cy="38" r="13" fill="#fff"/>'],
  ["3. Lune", "Un croissant et une petite étoile : les nuits, le sommeil. Le moment où l'app sert le plus.",
   '<path fill="#fff" d="M46.01 20.01A33 33 0 1 0 78.39 63.19A27 27 0 0 1 46.01 20.01Z"/><circle cx="72" cy="27" r="6" fill="#fff"/>'],
];
const svg = (inner, s) => `<svg viewBox="0 0 100 100" width="${s}" height="${s}" aria-hidden="true">${BG}${inner}</svg>`;
document.getElementById('opts').innerHTML = OPTS.map(([name, why, g]) => `
  <section class="opt"><h2>${name}</h2><p>${why}</p>
    <div class="row">${[80,48,32,24,16].map(s => svg(g, s)).join('')}</div>
    <div class="pair">
      <div class="tile light"><span class="lock">${svg(g,28)}Poulette HQ</span><span class="card">${svg(g,64)}Poulette HQ</span></div>
      <div class="tile dark"><span class="lock">${svg(g,28)}Poulette HQ</span><span class="card">${svg(g,64)}Poulette HQ</span></div>
    </div></section>`).join('');
</script>
</body>
</html>
