<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PouletteHQ — symboles</title>
<style>
:root{--bg:#FAFAF9;--surface:#fff;--text:#242424;--muted:#666;--border:#E5E5E3}
@media (prefers-color-scheme:dark){:root{--bg:#171819;--surface:#222426;--text:#F4F4F2;--muted:#ACB0B2;--border:#3B3E40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px} p{margin:0 0 16px;color:var(--muted)}
.opt{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin:16px 0}
.opt h2{font-size:17px;margin:0 0 2px} .opt p{margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.row svg{display:block}
.pair{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.tile{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:8px}
.light{background:#fff;border:1px solid #E5E5E3;color:#242424}.dark{background:#171819;color:#F4F4F2}
.lock{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.lock svg{width:28px;height:28px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.card svg{width:64px;height:64px;border-radius:14px}
</style>
</head>
<body>
<main>
<h1>Poulette HQ — l'œuf, 2 couleurs</h1>
<p>Symbole choisi : l'œuf. Couleurs proposées à la place de l'ambre (trop proche du… caca). Tailles : 80, 48, 32, 24, 16 px.</p>
<div id="opts"></div>
</main>
<template id="t">
</template>
<script>
const EGG = '<path fill="#fff" fill-rule="evenodd" d="M50 13C67 13 80 40 80 59C80 76 67 87 50 87C33 87 20 76 20 59C20 40 33 13 50 13ZM50 24C61 24 70 44 70 59C70 70 62 77 50 77C38 77 30 70 30 59C30 44 39 24 50 24Z"/><circle cx="50" cy="59" r="9" fill="#fff"/>';
const OPTS = [
  ["A. Corail", "#B4553F", "Chaud, doux, vivant. Contraste sur blanc 4,87:1. Bien distinct de la framboise de Personal HQ."],
  ["B. Sarcelle", "#3D7D78", "Bleu-vert calme, apaisant la nuit. Contraste sur blanc 4,77:1. Distinct des bleus de QED et Work (plus vert)."],
];
const OTHERS = [["Sport","#75638F"],["Work","#486B94"],["QED","#547B91"],["Personal","#9F597A"]];
const svg = (fill, s) => `<svg viewBox="0 0 100 100" width="${s}" height="${s}" aria-hidden="true"><rect width="100" height="100" rx="8" fill="${fill}"/>${EGG}</svg>`;
const sq = (fill) => `<svg viewBox="0 0 100 100" width="32" height="32" aria-hidden="true"><rect width="100" height="100" rx="8" fill="${fill}"/></svg>`;
document.getElementById('opts').innerHTML = OPTS.map(([name, c, why]) => `
  <section class="opt"><h2>${name} <code>${c}</code></h2><p>${why}</p>
    <div class="row">${[80,48,32,24,16].map(s => svg(c, s)).join('')}</div>
    <div class="pair">
      <div class="tile light"><span class="lock">${svg(c,28)}Poulette HQ</span><span class="card">${svg(c,64)}Poulette HQ</span></div>
      <div class="tile dark"><span class="lock">${svg(c,28)}Poulette HQ</span><span class="card">${svg(c,64)}Poulette HQ</span></div>
    </div>
    <p style="margin:12px 0 4px">À côté des autres HQ :</p>
    <div class="row">${OTHERS.map(([n,o]) => `<span class="card">${sq(o)}${n}</span>`).join('')}<span class="card">${svg(c,32)}Poulette</span></div>
  </section>`).join('');
</script>
</body>
</html>
