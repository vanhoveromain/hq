<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hq</title>
<link rel="icon" href="hq-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="hq-icon-180.png">
<style>
:root{--bg:#ffffff;--text:#111111;--muted:#6b6b6b;--line:#e6e6e6;--card:#fafafa;color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111111;--text:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a;--card:#181818;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111111;--text:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a;--card:#181818;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 16px}
main{width:100%;max-width:520px;text-align:center}
.mark{width:96px;height:auto;margin:0 auto 32px;display:block}
.mark.dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mark.light{display:none}:root:not([data-theme="light"]) .mark.dark{display:block}}
p{color:var(--muted);margin:0 0 32px}
nav{display:grid;gap:12px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;text-decoration:none;font-weight:600;transition:border-color .15s}
nav a:hover{border-color:var(--text)}
nav a span{font-weight:400;color:var(--muted);font-size:.9rem}
:focus-visible{outline:3px solid currentColor;outline-offset:2px}
</style>
</head>
<body>
<main>
  <img class="mark light" src="hq-mark.svg" alt="hq">
  <img class="mark dark" src="hq-mark-white.svg" alt="" aria-hidden="true">
  <p>Landing page coming soon.</p>
  <nav>
    <a href="https://sport.ownhq.app">sporthq <span>sport.ownhq.app →</span></a>
    <a href="https://qed.ownhq.app">QED Tools <span>qed.ownhq.app →</span></a>
  </nav>
</main>
</body>
</html>
