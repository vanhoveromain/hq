<!DOCTYPE html>
<html lang="en" data-auth="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HQ</title>
<meta name="description" content="HQ: one home for your own tools. QED HQ and Sport HQ.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171819" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="hq-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="hq-icon-180.png">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="hq-tokens.css">
<style>
/* HQ parent site (HQ Brand Guidelines v1.0, brand/guidelines-v1.0/):
   white background, charcoal HQ mark, a card per HQ with its coloured symbol.
   The parent brand has no colour of its own: product colours only live in
   the product symbols. */
:root{--page:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:var(--hq-canvas)}}
:root[data-theme="dark"]{--page:var(--hq-canvas)}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--page);color:var(--hq-primary-text);font:400 16px/1.5 var(--hq-font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:focus-visible{outline:2px solid var(--hq-ink);outline-offset:2px}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 16px}
@media (min-width:640px){.wrap{padding:0 32px}}

[data-auth="loading"] .when-in,[data-auth="loading"] .when-out,
[data-auth="out"] .when-in,[data-auth="in"] .when-out{display:none!important}

/* Top bar */
.top{padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--hq-ink);text-decoration:none;border-radius:var(--hq-radius-sm);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand svg{display:block;width:30px;height:auto}
.account{display:flex;align-items:center;gap:12px;min-width:0}
.who{font-size:14px;color:var(--hq-secondary-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
@media (max-width:479px){.who{display:none}}

main{flex:1;display:flex;flex-direction:column}

/* Logged in: greeting + HQ cards */
.home{padding-top:40px;padding-bottom:72px}
@media (min-width:640px){.home{padding-top:72px;padding-bottom:96px}}
.eyebrow{margin:0 0 12px;font:500 12px/1.4 var(--hq-font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hq-secondary-text)}
h1{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:0}
@media (min-width:640px){h1{font-size:44px}}
.lede{margin:12px 0 0;color:var(--hq-secondary-text);font-size:17px;max-width:46ch}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 8px;margin:40px 0 0;padding:0;list-style:none}
@media (min-width:640px){.cards{display:flex;flex-wrap:wrap;gap:32px 28px;margin-top:56px}}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;color:inherit;text-decoration:none;text-align:center;border-radius:var(--hq-radius)}
@media (min-width:640px){.card{width:96px;gap:10px}}
.card img{display:block;width:64px;height:64px;border-radius:14px;transition:transform var(--hq-ease),box-shadow var(--hq-ease)}
@media (min-width:640px){.card img{width:80px;height:80px;border-radius:18px}.card h2{font-size:14px}.card small{font-size:12px}}
a.card:hover img{transform:translateY(-3px);box-shadow:0 12px 24px -10px rgba(36,36,36,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a.card:hover img{box-shadow:0 12px 24px -10px rgba(0,0,0,.7)}}
:root[data-theme="dark"] a.card:hover img{box-shadow:0 12px 24px -10px rgba(0,0,0,.7)}
.card h2{margin:0;font-size:13px;font-weight:500;line-height:1.3}
.card small{display:block;margin-top:2px;font-size:11px;font-weight:400;color:var(--hq-secondary-text)}

/* Planned HQs (guidelines: planned, no URL, no features described) */
.card.planned img{opacity:.45;filter:saturate(.5)}
.card.planned h2{color:var(--hq-secondary-text)}
@media (prefers-reduced-motion: reduce){a.card:hover img{transform:none}}

/* Logged out: centred login panel */
.auth{flex:1;display:flex;align-items:center;justify-content:center;padding-top:32px;padding-bottom:64px}
.panel{width:100%;max-width:400px}
.panel h1{font-size:28px}
.panel .lede{font-size:15px;margin-top:8px}
.login{display:grid;gap:8px;margin-top:32px;padding:24px;border:1px solid var(--hq-border);border-radius:12px;background:var(--hq-surface)}
.field{display:grid;gap:6px;margin-bottom:8px}
.login label{font-size:14px;font-weight:500}
.login input{font:inherit;color:var(--hq-primary-text);background:var(--hq-surface);border:1px solid var(--hq-border-strong);border-radius:var(--hq-radius);padding:0 12px;min-height:44px;width:100%;transition:border-color var(--hq-ease)}
.login input:hover{border-color:var(--hq-secondary-text)}
.login input:focus-visible{outline:2px solid var(--hq-ink);outline-offset:0;border-color:var(--hq-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;font:600 14px/1 var(--hq-font);border-radius:var(--hq-radius);cursor:pointer;border:1px solid var(--hq-ink);background:var(--hq-ink);color:var(--page);transition:background-color var(--hq-ease),border-color var(--hq-ease)}
.btn:hover{background:var(--hq-accent-dark);border-color:var(--hq-accent-dark)}
.btn.secondary{background:var(--hq-surface);color:var(--hq-primary-text);border-color:var(--hq-border-strong)}
.btn.secondary:hover{background:var(--hq-subtle)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.login .btn{margin-top:4px}
@media (min-width:640px){.login .btn,.login input{min-height:40px}}
.divider{display:flex;align-items:center;gap:12px;margin:12px 0 4px;font-size:13px;color:var(--hq-secondary-text)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--hq-border)}
.hint{margin:0;font-size:13px;color:var(--hq-secondary-text);text-align:center}
.status{min-height:1.5em;margin:4px 0 0;font-size:14px;color:var(--hq-secondary-text)}
.status:empty{display:none}
.status.error{color:var(--hq-danger)}
.status.error::before{content:"Error: ";font-weight:600}
.status.ok{color:var(--hq-success)}

main{padding-bottom:env(safe-area-inset-bottom)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <a class="brand" href="/" aria-label="HQ home">
      <!-- HQ mark (provisional redraw of the approved reference: brand/export.mjs) -->
      <svg viewBox="4.6 10.2 82.5 80" aria-hidden="true" focusable="false"><g fill="currentColor" transform="translate(.6 .7)"><path d="M59 12.42A40 40 0 0 0 20 81.5L20 70.67A32 32 0 0 1 59 21.23Z"/><path d="M68 17.5A40 40 0 0 1 78.95 68.95L73.01 63.01A32 32 0 0 0 68 28.33Z"/><path d="M29 86.58A40 40 0 0 0 73.5 76.5L67.84 70.84A32 32 0 0 1 29 77.77Z"/><path d="M67.84 70.84L86.5 89.5L75.5 89.5L62.34 76.34Z"/><path d="M29 32L37 28L37 85L29 85Z"/><path d="M51 15L59 15L59 67L51 71Z"/><path d="M36.5 46H51.5V53H36.5Z"/></g></svg><span aria-hidden="true">HQ</span>
    </a>
    <div class="account when-in">
      <span id="who" class="who"></span>
      <button id="logout" type="button" class="btn secondary small">Log out</button>
    </div>
  </div>
</div>

<main>
  <section class="auth wrap when-out" aria-labelledby="login-title">
    <div class="panel">
      <h1 id="login-title">Log in to HQ</h1>
      <p class="lede">One login for every HQ.</p>
      <form id="login-form" class="login" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Log in</button>
        <p id="login-status" class="status" role="status"></p>
        <div class="divider">or</div>
        <button id="send-link" type="button" class="btn secondary">Email me a login link</button>
        <p class="hint">No password yet, or forgot it? Use the link.</p>
      </form>
    </div>
  </section>

  <section class="home wrap when-in" aria-labelledby="greeting">
    <p id="today" class="eyebrow"></p>
    <h1 id="greeting">Welcome back</h1>
    <p class="lede">Pick up where you left off.</p>

    <ul class="cards" aria-label="Your HQs">
      <li>
        <a class="card" href="https://qed.ownhq.app">
          <img src="qed-hq.svg" alt="" width="80" height="80">
          <h2>QED HQ</h2>
        </a>
      </li>
      <li>
        <a class="card" href="https://sport.ownhq.app">
          <img src="sport-hq.svg" alt="" width="80" height="80">
          <h2>Sport HQ</h2>
        </a>
      </li>
      <li>
        <div class="card planned">
          <img src="work-hq.svg" alt="" width="80" height="80">
          <h2>Work HQ<small>Coming soon</small></h2>
        </div>
      </li>
      <li>
        <div class="card planned">
          <img src="personal-hq.svg" alt="" width="80" height="80">
          <h2>Personal HQ<small>Coming soon</small></h2>
        </div>
      </li>
    </ul>
  </section>
</main>

<script type="module" src="home.js"></script>
</body>
</html>
