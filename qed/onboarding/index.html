<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dani’s first two weeks at QED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --teal:#2C4D5C; --green:#27C490; --green-ink:#178a63; --purple:#B35A94; --danger:#c0392b; --warn:#a4561d;
  --bg:#F5F5F5; --surface:#FFFFFF; --row:#F2F5F7; --text:#2C4D5C; --muted:#5a6b73; --faint:#9aa8ae;
  --line:#dfe5e8; --hero:#2C4D5C;
  --onb-bg:#e3f7ef; --onb-bar:#27C490; --trn-bg:#e6edf0; --trn-bar:#2C4D5C;
  --setup-bg:#fbf1f7; --setup-bar:#D9A6C7; --event-bg:#f3dfec; --event-bar:#B35A94;
  --off-bg:#e9ecee; --av:#2C4D5C; --av-text:#fff;
  --font:"Poppins","Helvetica Neue",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13232b; --surface:#1b2f38; --row:#223a45; --text:#e8eff1; --muted:#a9bbc2; --faint:#6f8590; --line:#2f4955; --hero:#0e1c22; --green-ink:#4fdcab; --danger:#ff7b6b; --warn:#f0a868;
    --onb-bg:#173d33; --trn-bg:#22394a; --setup-bg:#2f2a33; --event-bg:#3a2535; --off-bg:#22343c; --trn-bar:#8fb3c4; --av:#8fb3c4; --av-text:#0e1c22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13232b; --surface:#1b2f38; --row:#223a45; --text:#e8eff1; --muted:#a9bbc2; --faint:#6f8590; --line:#2f4955; --hero:#0e1c22; --green-ink:#4fdcab; --danger:#ff7b6b; --warn:#f0a868;
  --onb-bg:#173d33; --trn-bg:#22394a; --setup-bg:#2f2a33; --event-bg:#3a2535; --off-bg:#22343c; --trn-bar:#8fb3c4; --av:#8fb3c4; --av-text:#0e1c22; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55}
body.has-bar{padding-bottom:96px}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 1.25rem}

/* hero */
.hero{background:var(--hero);color:#fff;padding:1.75rem 0 4.5rem}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.75rem;gap:1rem}
.hero img{height:34px;width:auto;display:block}
.hero-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:end}
.hero h1{font-size:clamp(1.9rem,1.4rem + 2vw,2.8rem);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0 0 .35rem}
.hero p{margin:0;color:#d5e2e7}
.progress{margin-top:1.4rem;display:flex;align-items:center;gap:1rem;max-width:460px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--green);transition:width .4s ease}
.progress small{font-size:.85rem;color:#d5e2e7;white-space:nowrap}
.next{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:1rem 1.15rem;cursor:pointer;text-align:left;width:100%;color:#fff}
.next:hover{background:rgba(255,255,255,.13)}
.next .k{font-size:.8rem;color:#bfd2d9}
.next .t{font-size:1.15rem;font-weight:600;margin:.15rem 0 .3rem}
.next .m{font-size:.85rem;color:#d5e2e7}
.editbtn{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:4px;padding:.45rem 1rem;font-weight:500;font-size:.88rem;cursor:pointer}
.editbtn:hover{background:rgba(255,255,255,.1)}
.editbtn[aria-pressed="true"]{background:#fff;color:var(--teal);border-color:#fff}

/* controls */
.controls{background:var(--surface);border-radius:8px;padding:.85rem 1rem;margin-top:-2.6rem;box-shadow:0 4px 16px rgba(44,77,92,.12);position:relative;display:grid;gap:.7rem}
.crow{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.seg{display:inline-flex;background:var(--row);border-radius:6px;padding:3px}
.seg button{border:0;background:transparent;padding:.4rem .85rem;border-radius:4px;font-size:.86rem;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(44,77,92,.15)}
.todaybtn{border:1.5px solid var(--line);background:transparent;border-radius:6px;padding:.38rem .85rem;font-size:.86rem;font-weight:500;cursor:pointer}
.todaybtn:hover{border-color:var(--text)}
.right{margin-left:auto;display:flex;gap:.6rem;align-items:center}
.who{display:flex;align-items:center;gap:.5rem;font-size:.86rem;color:var(--muted)}
.who select{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:.38rem .6rem;font-size:.86rem;color:var(--text);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.25rem .75rem;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;color:var(--text)}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.link{border:0;background:none;color:var(--green-ink);font-weight:500;font-size:.84rem;cursor:pointer;padding:.25rem 0}
.hint{font-size:.8rem;color:var(--muted)}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:.05rem .55rem;font-size:.74rem;font-weight:500;background:var(--av);color:var(--av-text);border:1.5px solid var(--av);white-space:nowrap;line-height:1.5}
.tag.team{background:transparent;color:var(--text);border-color:var(--text)}
.tag.tbc{background:transparent;border:1.5px dashed var(--warn);color:var(--warn)}

/* calendar */
.week{margin-top:2rem}
.week h2{font-size:1.2rem;font-weight:600;margin:0 0 .8rem;display:flex;align-items:baseline;gap:.75rem}
.week h2 small{font-size:.85rem;font-weight:400;color:var(--muted)}
.grid{display:grid;grid-template-columns:40px repeat(5,minmax(180px,1fr));gap:6px;overflow-x:auto;padding-bottom:4px}
.dayhead{all:unset;cursor:pointer;padding:.55rem .75rem;background:var(--surface);border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.dayhead b{font-weight:600;font-size:.92rem}
.dayhead span{font-size:.8rem;color:var(--muted)}
.dayhead em{font-style:normal;font-size:.72rem;color:#fff;background:var(--green-ink);border-radius:999px;padding:0 .5rem;font-weight:500}
.dayhead:hover{background:var(--row)}
.dayhead.today{box-shadow:inset 0 -3px 0 var(--green)}
.dayhead.past b,.dayhead.past span{opacity:.6}
.rowlab{font-size:.72rem;color:var(--muted);font-weight:500;padding-top:.7rem;text-align:center}
.cell{background:var(--surface);border-radius:6px;padding:6px;min-height:120px;display:flex;flex-direction:column;gap:6px;transition:background .15s ease, box-shadow .15s ease}
.cell.off{background:var(--off-bg);align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.85rem}
.cell.off strong{display:block;color:var(--text);font-weight:500}
.free{flex:1;display:flex;align-items:center;justify-content:center;font-size:.78rem;color:var(--faint)}
body.editing .cell:not(.off){box-shadow:inset 0 0 0 1.5px var(--line)}
.cell.over{background:var(--row);box-shadow:inset 0 0 0 2px var(--green)!important}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:5px;padding:.4rem;font-size:.8rem;font-weight:500;color:var(--green-ink);cursor:pointer;text-align:center}
.add:hover{border-color:var(--green);background:var(--row)}
.cell .add.fill{flex:1}
@media (hover:hover){ .cell .add:not(.fill){opacity:0;transition:opacity .15s ease} .cell:hover .add,.cell .add:focus-visible{opacity:1} }

/* session block */
.blk{all:unset;cursor:pointer;display:block;border-radius:6px;padding:.55rem .7rem .6rem .85rem;position:relative;font-size:.82rem;line-height:1.4;transition:transform .15s ease, box-shadow .15s ease}
.blk:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(44,77,92,.14)}
.blk:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:6px 0 0 6px}
.blk.onb{background:var(--onb-bg)} .blk.onb::before{background:var(--onb-bar)}
.blk.trn{background:var(--trn-bg)} .blk.trn::before{background:var(--trn-bar)}
.blk.setup{background:var(--setup-bg)} .blk.setup::before{background:var(--setup-bar)}
.blk.event{background:var(--event-bg)} .blk.event::before{background:var(--event-bar)}
.blk .time{display:block;font-size:.74rem;color:var(--muted);font-weight:500}
.blk .ttl{display:block;font-weight:600;font-size:.9rem;line-height:1.3;margin:.05rem 0 .3rem}
.blk .place{display:block;color:var(--muted)}
.blk .place b{color:var(--text);font-weight:500}
.with{display:flex;align-items:flex-start;gap:.45rem;margin-top:.45rem;font-size:.78rem}
.with .lbl{color:var(--muted);padding-top:.05rem}
.blk.float{outline:1.5px dashed var(--onb-bar);outline-offset:-1.5px}
.blk.done{opacity:.55}
.blk.done .ttl{text-decoration:line-through;text-decoration-thickness:1.5px}
.check{position:absolute;right:.5rem;top:.45rem;width:18px;height:18px;border-radius:50%;background:var(--green-ink);color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.blk.dim{opacity:.15}
.blk.gone{display:none}
body.editing .blk{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.blk.dragging{opacity:.3}
.drag-ghost{position:fixed!important;z-index:50;pointer-events:none;box-shadow:0 10px 28px rgba(10,38,64,.3);transform:rotate(1.5deg);opacity:.95;margin:0}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.blk.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--green)}100%{box-shadow:0 0 0 0 transparent}}

/* agenda */
.agenda{margin-top:2rem;display:grid;gap:1rem}
.aday{background:var(--surface);border-radius:8px;padding:1rem 1.2rem;display:grid;grid-template-columns:130px 1fr;gap:1rem}
.aday.today{box-shadow:inset 4px 0 0 var(--green)}
.aday.past{opacity:.7}
.aday h3{margin:0;font-size:1.05rem;font-weight:600;line-height:1.25}
.aday h3 span{display:block;font-size:.85rem;font-weight:400;color:var(--muted)}
.aday h3 em{font-style:normal;display:inline-block;margin-top:.3rem;font-size:.72rem;color:#fff;background:var(--green-ink);border-radius:999px;padding:0 .5rem;font-weight:500}
.alist{display:grid;gap:.5rem}
.slotlab{font-size:.75rem;color:var(--muted);font-weight:500;margin-top:.2rem}
.alist .blk{display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;align-items:center}
.alist .blk .with{margin:0;justify-content:flex-end}
.alist .free{justify-content:flex-start;padding:.2rem 0}

/* tray */
.tray{margin:2.25rem 0 1rem;background:var(--surface);border-radius:8px;padding:1.2rem 1.25rem 1.3rem}
.tray h2{font-size:1.1rem;font-weight:600;margin:0 0 .2rem}
.tray p{margin:0 0 .9rem;color:var(--muted);font-size:.86rem}
.tray .list{display:flex;flex-wrap:wrap;gap:.6rem;min-height:56px;border-radius:6px;padding:4px;transition:background .15s ease}
.tray .list.over{background:var(--row);box-shadow:inset 0 0 0 2px var(--green)}
.tray .blk{min-width:240px}
footer{color:var(--muted);font-size:.8rem;padding:1rem 0 3rem}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(44,77,92,.12);padding:.75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom,0px));z-index:20}
.savebar .wrap{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:0}
.savebar .msg{font-size:.86rem;flex:1;min-width:220px;line-height:1.4}
.savebar .msg b{font-weight:600}
.savebar .msg .checks{display:block;color:var(--warn);font-size:.8rem}
.savebar .msg.err b{color:var(--danger)}
.savebar .msg.ok b{color:var(--green-ink)}

/* dialog */
dialog{border:0;border-radius:10px;padding:0;max-width:520px;width:calc(100% - 2rem);max-height:calc(100% - 2rem);background:var(--surface);color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,38,64,.5)}
.dtop{height:6px}
.dbody{padding:1.35rem 1.5rem 1.5rem}
.dbody .cat{font-size:.8rem;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.dbody .cat i{width:10px;height:10px;border-radius:3px}
.dbody h3{font-size:1.35rem;font-weight:600;margin:.15rem 0 1.1rem;line-height:1.25}
.dbody dl{display:grid;grid-template-columns:110px 1fr;gap:.6rem .9rem;margin:0 0 1.4rem;font-size:.93rem}
.dbody dt{color:var(--muted)}
.dbody dd{margin:0;font-weight:500}
.daylist{display:grid;gap:.5rem;margin-bottom:1.3rem}
.dl-item{all:unset;cursor:pointer;display:grid;grid-template-columns:96px 1fr;gap:.9rem;padding:.6rem .7rem;border-radius:6px;background:var(--row)}
.dl-item:hover{outline:1.5px solid var(--line)}
.dl-item .w{font-size:.82rem;color:var(--muted)}
.dl-item b{font-weight:600;display:block}
.dl-item small{color:var(--muted);font-size:.8rem}
.dact{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.dact .grow{flex:1}
.btn{border:0;border-radius:4px;padding:.6rem 1.15rem;font-weight:500;font-size:.9rem;cursor:pointer}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:#1fa677}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--text)}
.btn.ghost:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid transparent;padding-left:.2rem}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1rem;margin-bottom:1.4rem}
.form .full{grid-column:1/-1}
.field[hidden]{display:none}
.field{display:grid;gap:.3rem;font-size:.82rem;color:var(--muted);font-weight:500}
.form input[type=text],.form select,.form textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:5px;padding:.55rem .65rem;font-size:.92rem;color:var(--text)}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--green)}
.form textarea{min-height:60px;resize:vertical}
.form .err{color:var(--danger);font-size:.8rem}
.typepick{display:flex;flex-wrap:wrap;gap:.4rem}
.typepick label,.pp label{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);border-radius:999px;padding:.25rem .75rem;color:var(--text);cursor:pointer;font-weight:400;font-size:.85rem}
.typepick label i{width:10px;height:10px;border-radius:3px}
.typepick label:has(input:checked),.pp label:has(input:checked){border-color:var(--text);background:var(--row);font-weight:500}
.typepick input,.pp input{position:absolute;opacity:0;pointer-events:none}
.typepick label:has(input:focus-visible),.pp label:has(input:focus-visible){outline:3px solid var(--green);outline-offset:2px}
.pp{display:flex;flex-wrap:wrap;gap:.4rem}
.presets{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.1rem}
.presets button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:.1rem .5rem;font-size:.75rem;cursor:pointer;color:var(--muted)}
.presets button:hover{border-color:var(--text);color:var(--text)}
.addp{display:flex;gap:.4rem;margin-top:.5rem}
.addp input{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:5px;padding:.45rem .6rem;font-size:.88rem}
.inline{display:flex;align-items:center;gap:.5rem;color:var(--text);font-size:.88rem;cursor:pointer}

@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .aday{grid-template-columns:1fr;gap:.5rem}
  .alist .blk{grid-template-columns:1fr}
  .alist .blk .with{justify-content:flex-start}
  .right{margin-left:0}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  .controls,.savebar,.editbtn,.next,.tray,footer,.add{display:none!important}
  .hero{padding:1rem 0;background:#fff;color:var(--teal)} .hero p{color:var(--muted)}
  body{background:#fff} .cell{min-height:auto}
}
</style>
</head>

S.sessions.forEach(i=>{if(i.c==="ops")i.c=/set[- ]?up/i.test(i.t)?"setup":"event";if(!CATS[i.c])i.c="event";if(!i.with)i.with=[]});
let savedJSON=JSON.stringify(S);
const DONE_KEY="dani-onboarding-done",PEND_KEY="dani-onboarding-pending",EDIT_KEY="dani-onboarding-edit";
let done={};try{done=JSON.parse(localStorage.getItem(DONE_KEY)||"{}")}catch(e){}
const saveDone=()=>{try{localStorage.setItem(DONE_KEY,JSON.stringify(done))}catch(e){}};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};

  edit:ss.get(EDIT_KEY)==="1",canEdit:null,canSave:"unknown",msg:"",msgKind:"",saving:false,pending:null};
const undo=[];
const d0=new Date();const todayISO=`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,"0")}-${String(d0.getDate()).padStart(2,"0")}`;
const inRange=DAYS.some(d=>d.iso===todayISO);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const dirty=()=>JSON.stringify(S)!==savedJSON;
const person=k=>S.people.find(p=>p.k===k);
const pname=k=>(person(k)||{n:k}).n;
const dayOf=i=>i.slot==="tray"?null:DAYS.find(d=>d.iso===i.slot.split("|")[0]);
const half=slot=>slot.split("|")[1]==="am"?"morning":"afternoon";
const slotLabel=slot=>{if(slot==="tray")return "Still to schedule";const d=DAYS.find(x=>x.iso===slot.split("|")[0]);return `${d.d} ${d.n}, ${half(slot)}`};
const inSlot=slot=>S.sessions.filter(i=>i.slot===slot);
const uid=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const GENERIC=/^(morning|afternoon|all day|not scheduled yet)?$/i;
const specificTime=i=>i.time&&!GENERIC.test(i.time.trim())?i.time:"";
const whenText=i=>{const d=dayOf(i);if(!d)return "Not scheduled yet";const t=specificTime(i);return `${d.d} ${d.n}, ${t||half(i.slot)}`};
const withText=i=>i.with.length?i.with.map(pname).join(", "):"to be confirmed";
function placeHTML(i){
  if(i.c==="onb")return "";
  if(i.client&&i.venue&&i.client.trim().toLowerCase()===i.venue.trim().toLowerCase()) return `<span class="place"><b>${esc(i.client)}</b> (client and venue)</span>`;
  const parts=[];if(i.client)parts.push(`<b>${esc(i.client)}</b>`);if(i.venue)parts.push(i.client?`at ${esc(i.venue)}`:`<b>${esc(i.venue)}</b>`);
  return parts.length?`<span class="place">${parts.join(" ")}</span>`:`<span class="place">Venue to be confirmed</span>`;
}

function readForm(){

    venue:$("f-venue").value.trim(),with:[...document.querySelectorAll('#f-ppl input[name=with]:checked')].map(x=>x.value),note:$("f-note").value.trim(),float:$("f-float").checked};

function applyForm(){
  const v=readForm();if(!v)return;const id=$("ef").dataset.id;snapshot();let nid=id;
  if(!id){nid=uid();S.sessions.push(Object.assign({id:nid},v))}
  else{const idx=S.sessions.findIndex(x=>x.id===id);const old=S.sessions[idx];const upd=Object.assign({},old,v);if(!v.client)delete upd.client;
    if(old.slot!==v.slot){S.sessions.splice(idx,1);S.sessions.push(upd)}else S.sessions[idx]=upd}
  st.msg="";dlg().close();render();flash(nid);
}
function moveSession(id,slot,beforeId){
  const idx=S.sessions.findIndex(x=>x.id===id);if(idx<0)return;
  const cur=S.sessions[idx];if(cur.slot===slot&&!beforeId&&S.sessions.map(x=>x.slot).lastIndexOf(slot)===idx)return;
  snapshot();
  const s=S.sessions.splice(idx,1)[0];
  if(s.slot!==slot&&GENERIC.test((s.time||"").trim()))s.time=slot==="tray"?"":slot.endsWith("|am")?"Morning":"Afternoon";
  s.slot=slot;
  let at=beforeId?S.sessions.findIndex(x=>x.id===beforeId):-1;
  if(at<0){const last=S.sessions.map(x=>x.slot).lastIndexOf(slot);at=last<0?S.sessions.length:last+1}

if(!EDITOR&&st.edit){st.edit=false;ss.del(EDIT_KEY)}
function buildHTML(){

  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n"+HEAD+"<style id=\"css\">"+css+"</style>\n</head>\n<body>\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"state\">"+json+E+"\n<script id=\"app\">"+app+E+"\n</body>\n</html>\n";

  const ad=t.closest("[data-add]");if(ad){openEditor(null,ad.dataset.add);return}
  const b=t.closest(".blk");if(b){openSession(b.dataset.id);return}
  const dh=t.closest("[data-day]");if(dh){openDay(dh.dataset.day);return}

  const od=t.closest("[data-openday]");if(od){openDay(od.dataset.openday);return}

  const tg=t.closest("[data-toggle]");if(tg){const id=tg.dataset.toggle;if(done[id])delete done[id];else done[id]=true;saveDone();render();dlg().close();return}
  if(t.closest("#next")){const id=$("next").dataset.id;if(id)openSession(id);return}
  if(t.closest("#gotoday")){const el=$("d-"+todayISO);if(el)el.scrollIntoView({block:"start"});return}
  const v=t.closest("[data-view]");if(v){st.view=v.dataset.view;render();return}
  const w=t.closest("[data-week]");if(w){st.week=w.dataset.week;render();return}
  const c=t.closest("[data-cat]");if(c){st.cats[c.dataset.cat]=!st.cats[c.dataset.cat];render();return}
  if(t.closest("#reset")){st.cats={onb:true,trn:true,setup:true,event:true};st.person="";render();return}
  if(t.closest("#editToggle")){st.edit=!st.edit;st.edit?ss.set(EDIT_KEY,"1"):ss.del(EDIT_KEY);st.msg="";render();return}
  if(t.closest("#doneEdit")){st.edit=false;ss.del(EDIT_KEY);st.msg="";render();return}
  if(t.closest("#undo")){doUndo();return}
  if(t.closest("#discard")){if(st.pending){st.pending=null;ls.del(PEND_KEY)}else{snapshot();S=JSON.parse(savedJSON)}st.msg="";render();return}
  if(t.closest("#save")){if(st.pending){S=JSON.parse(st.pending);st.pending=null;ls.del(PEND_KEY);st.edit=true;render();return}save();return}
  if(t.closest("#f-apply")){applyForm();return}
  if(t.closest("#f-addp")){const inp=$("f-newp"),n=inp.value.trim();if(!n)return;
    const ex=S.people.find(p=>p.n.toLowerCase()===n.toLowerCase());
    if(ex){const cb=document.querySelector(`#f-ppl input[value="${ex.k}"]`);if(cb)cb.checked=true;inp.value="";return}
    let k=n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"p";while(person(k))k+="-2";
    snapshot();S.people.push({k,n});$("f-ppl").insertAdjacentHTML("beforeend",pplBox({k,n},true));inp.value="";return}
  if(t.closest("#f-dup")){const id=$("ef").dataset.id;snapshot();const idx=S.sessions.findIndex(x=>x.id===id);const cp=Object.assign({},S.sessions[idx],{id:uid(),with:[...S.sessions[idx].with]});S.sessions.splice(idx+1,0,cp);dlg().close();render();flash(cp.id);return}
  if(t.closest("#f-del")){const id=$("ef").dataset.id;const nm=S.sessions.find(x=>x.id===id).t;snapshot();S.sessions=S.sessions.filter(x=>x.id!==id);delete done[id];saveDone();dlg().close();st.msg=`“${nm}” deleted. Use Undo to bring it back.`;st.msgKind="";render();return}
});

document.addEventListener("keydown",e=>{
  const typing=e.target.closest&&e.target.closest("input,textarea,select");
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&st.edit&&!typing&&!dlg().open){e.preventDefault();doUndo();return}
  if(e.key==="Enter"&&e.target.id==="f-newp"){e.preventDefault();$("f-addp").click();return}
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("#ef")&&e.target.tagName==="INPUT"&&e.target.type==="text"&&!e.target.list){e.preventDefault();applyForm()}
});
document.addEventListener("click",e=>{if(e.target===dlg())dlg().close()},true);

/* drag and drop (pointer-based: mouse, trackpad and touch) */
let drag0=null,ghost=null,justDragged=false,holdT=null,scrollRAF=null,lastY=0;
function zoneAt(x,y){const el=document.elementFromPoint(x,y);return el?el.closest("[data-slot]"):null}
function clearOver(){document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))}
function autoScroll(){if(!drag0||!drag0.active)return;const m=80,h=innerHeight;if(lastY<m)scrollBy(0,-14);else if(lastY>h-m)scrollBy(0,14);scrollRAF=requestAnimationFrame(autoScroll)}
function startDrag(){const b=drag0.el,r=b.getBoundingClientRect();ghost=b.cloneNode(true);ghost.classList.add("drag-ghost");ghost.style.width=r.width+"px";ghost.style.left=r.left+"px";ghost.style.top=r.top+"px";document.body.appendChild(ghost);
  b.classList.add("dragging");drag0.active=true;drag0.ox=drag0.x-r.left;drag0.oy=drag0.y-r.top;document.body.classList.add("is-dragging");autoScroll()}
document.addEventListener("pointerdown",e=>{if(!st.edit||e.button>0)return;const b=e.target.closest&&e.target.closest(".blk");if(!b||dlg().contains(b))return;
  drag0={el:b,id:b.dataset.id,x:e.clientX,y:e.clientY,type:e.pointerType,active:false};lastY=e.clientY;
  if(e.pointerType!=="mouse"){clearTimeout(holdT);holdT=setTimeout(()=>{if(drag0&&!drag0.active){startDrag();if(navigator.vibrate)navigator.vibrate(15)}},350)}});
document.addEventListener("pointermove",e=>{if(!drag0)return;lastY=e.clientY;
  if(!drag0.active){const dist=Math.hypot(e.clientX-drag0.x,e.clientY-drag0.y);
    if(drag0.type==="mouse"){if(dist>5){e.preventDefault();startDrag()}else return}else{if(dist>10){clearTimeout(holdT);drag0=null}return}}
  e.preventDefault();ghost.style.left=(e.clientX-drag0.ox)+"px";ghost.style.top=(e.clientY-drag0.oy)+"px";
  const z=zoneAt(e.clientX,e.clientY);clearOver();if(z)z.classList.add("over")},{passive:false});
document.addEventListener("touchmove",e=>{if(drag0&&drag0.active)e.preventDefault()},{passive:false});
document.addEventListener("dragstart",e=>{if(st.edit&&e.target.closest&&e.target.closest(".blk"))e.preventDefault()});
document.addEventListener("contextmenu",e=>{if(st.edit&&e.target.closest&&e.target.closest(".blk"))e.preventDefault()});
function endDrag(e){clearTimeout(holdT);if(!drag0)return;const d=drag0;drag0=null;cancelAnimationFrame(scrollRAF);if(!d.active)return;
  justDragged=true;setTimeout(()=>{justDragged=false},80);
  if(ghost){ghost.remove();ghost=null}d.el.classList.remove("dragging");document.body.classList.remove("is-dragging");clearOver();
  if(e.type==="pointercancel")return;
  const z=zoneAt(e.clientX,e.clientY);if(!z)return;
  const tray=z.id==="tray";let before=null;
  for(const s of [...z.querySelectorAll(".blk")].filter(x=>x.dataset.id!==d.id)){const r=s.getBoundingClientRect();
    const isBefore=tray?(e.clientY<r.top||(e.clientY<=r.bottom&&e.clientX<r.left+r.width/2)):(e.clientY<r.top+r.height/2);
    if(isBefore){before=s.dataset.id;break}}
  moveSession(d.id,z.dataset.slot,before)}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);
document.addEventListener("click",e=>{if(justDragged){e.stopPropagation();e.preventDefault()}},true);

frame();render();
if(inRange&&st.view==="agenda")setTimeout(()=>{const el=$("d-"+todayISO);if(el)el.scrollIntoView({block:"start"})},100);
})();
</script>
