<!DOCTYPE html>
<html lang="en" data-hq="qed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dani’s first two weeks at QED</title>
<link rel="icon" href="/assets/qed-hq-icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/qed-hq-icon-180.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#222426" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/hq-tokens.css">
<script type="module" src="https://ownhq.app/switcher.js"></script>
<style id="css">
/* QED HQ onboarding plan. HQ Brand Guidelines v1.0: tokens come from
   /assets/hq-tokens.css (--hq-*), QED HQ accent via data-hq="qed".
   Category colours are data-visualisation colours (guidelines §07): pale
   background + darker bar, always shown with a text label. */
:root{
  --bg:var(--hq-canvas); --surface:var(--hq-surface); --row:var(--hq-subtle); --line:var(--hq-border); --line-strong:var(--hq-border-strong);
  --text:var(--hq-primary-text); --muted:var(--hq-secondary-text); --faint:var(--hq-secondary-text);
  --accent:var(--hq-accent); --accent-ink:var(--hq-accent-text); --accent-pale:var(--hq-accent-light); --on-accent:var(--hq-on-accent);
  --accent-hover:#3B6075; --pill-bg:var(--hq-accent-text); --pill-text:var(--hq-surface);
  --danger:var(--hq-danger); --warn:var(--hq-warning); --ok:var(--hq-success);
  --onb-bg:#E8F2EC; --onb-bar:#4E8A68; --trn-bg:#EBF2F5; --trn-bar:#547B91;
  --setup-bg:#F7F0E0; --setup-bar:#A27A2C; --event-bg:#F5EBF2; --event-bar:#8E5680;
  --off-bg:var(--hq-subtle);
  --font:var(--hq-font); --mono:var(--hq-font-mono);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent-hover:#46697C;
    --onb-bg:#1E2E25; --onb-bar:#7DBF98; --trn-bg:#22303A; --trn-bar:#8FB7CC;
    --setup-bg:#332B1B; --setup-bar:#D2A85A; --event-bg:#33232F; --event-bar:#C995B8;
  }
}
:root[data-theme="dark"]{
  --accent-hover:#46697C;
  --onb-bg:#1E2E25; --onb-bar:#7DBF98; --trn-bg:#22303A; --trn-bar:#8FB7CC;
  --setup-bg:#332B1B; --setup-bar:#D2A85A; --event-bg:#33232F; --event-bar:#C995B8;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
body.has-bar{padding-bottom:112px}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
@media (min-width:640px){.wrap{padding:0 24px}}

/* top bar: HQ switcher (product identity) + edit button */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px}
hq-switcher{min-height:40px;min-width:0}
hq-switcher:not(:defined){display:inline-flex;align-items:center;font-weight:600}

/* header (calm, on the canvas) */
.hero{padding:32px 0 24px}
@media (min-width:640px){.hero{padding:48px 0 32px}}
.hero-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:end}
.hero h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin:0 0 4px}
@media (min-width:640px){.hero h1{font-size:36px}}
.hero p{margin:0;color:var(--muted)}
.progress{margin-top:20px;display:flex;align-items:center;gap:16px;max-width:460px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width 200ms ease}
.progress small{font-size:14px;color:var(--muted);white-space:nowrap}
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--hq-radius);padding:16px 20px;cursor:pointer;text-align:left;width:100%;color:var(--text);transition:border-color var(--hq-ease),background-color var(--hq-ease)}
.next:hover{border-color:var(--line-strong)}
.next .k{font-size:12px;font-weight:500;color:var(--muted)}
.next .t{font-size:18px;font-weight:600;line-height:1.25;margin:4px 0}
.next .m{font-size:14px;color:var(--muted)}
.editbtn{display:inline-flex;align-items:center;min-height:40px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:var(--hq-radius);padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background-color var(--hq-ease),border-color var(--hq-ease)}
.editbtn:hover{background:var(--row)}
.editbtn[aria-pressed="true"]{background:var(--accent-pale);color:var(--accent-ink);border-color:var(--accent)}

/* controls */
.controls{background:var(--surface);border:1px solid var(--line);border-radius:var(--hq-radius);padding:12px 16px;display:grid;gap:12px}
.crow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.seg{display:inline-flex;background:var(--row);border-radius:var(--hq-radius);padding:2px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 12px;border-radius:var(--hq-radius-sm);font-size:14px;font-weight:500;cursor:pointer;color:var(--muted);transition:background-color var(--hq-ease),color var(--hq-ease)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-strong)}
.todaybtn{min-height:40px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--hq-radius);padding:0 12px;font-size:14px;font-weight:500;cursor:pointer;transition:background-color var(--hq-ease)}
.todaybtn:hover{background:var(--row)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who select{min-height:40px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--hq-radius);padding:0 8px;font-size:14px;color:var(--text);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:0 12px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--text);transition:background-color var(--hq-ease),opacity var(--hq-ease)}
.chip:hover{background:var(--row)}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.link{border:0;background:none;color:var(--accent-ink);font-weight:500;font-size:14px;cursor:pointer;min-height:32px;padding:0 4px;text-decoration:underline;text-underline-offset:3px;border-radius:var(--hq-radius-sm)}
.hint{font-size:12px;color:var(--muted)}

/* tags (people) */
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:0 8px;font-size:12px;font-weight:500;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);white-space:nowrap;line-height:20px}
.tag.team{background:transparent;border-color:var(--text)}
.tag.tbc{background:transparent;border:1px dashed var(--warn);color:var(--warn)}

/* calendar */
.week{margin-top:32px}
.week h2{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.25;margin:0 0 12px;display:flex;align-items:baseline;gap:12px}
@media (min-width:640px){.week h2{font-size:24px}}
.week h2 small{font-size:14px;font-weight:400;letter-spacing:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:40px repeat(5,minmax(180px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.dayhead{all:unset;box-sizing:border-box;cursor:pointer;min-height:40px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--hq-radius-sm);display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background-color var(--hq-ease)}
.dayhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dayhead b{font-weight:600;font-size:14px}
.dayhead span{font-size:14px;color:var(--muted)}
.dayhead em,.aday h3 em{font-style:normal;font-size:12px;line-height:20px;color:var(--pill-text);background:var(--pill-bg);border-radius:999px;padding:0 8px;font-weight:500}
.dayhead:hover{background:var(--row)}
.dayhead.today{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.dayhead.past b,.dayhead.past span{opacity:.65}
.rowlab{font-size:12px;color:var(--muted);font-weight:500;padding-top:12px;text-align:center}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--hq-radius-sm);padding:6px;min-height:120px;display:flex;flex-direction:column;gap:6px;transition:background-color var(--hq-ease),box-shadow var(--hq-ease)}
.cell.off{background:var(--off-bg);align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px}
.cell.off strong{display:block;color:var(--text);font-weight:500}
.free{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint)}
body.editing .cell:not(.off){border-style:dashed;border-color:var(--line-strong)}
.cell.over{background:var(--accent-pale);box-shadow:inset 0 0 0 2px var(--accent)!important}
.add{min-height:32px;border:1px dashed var(--line-strong);background:transparent;border-radius:var(--hq-radius-sm);padding:4px 8px;font-size:14px;font-weight:500;color:var(--accent-ink);cursor:pointer;text-align:center;transition:background-color var(--hq-ease),border-color var(--hq-ease),opacity var(--hq-ease)}
.add:hover{border-color:var(--accent);background:var(--accent-pale)}
.cell .add.fill{flex:1}
@media (hover:hover){ .cell .add:not(.fill){opacity:0} .cell:hover .add,.cell .add:focus-visible{opacity:1} }

/* session block */
.blk{all:unset;box-sizing:border-box;cursor:pointer;display:block;border-radius:var(--hq-radius-sm);padding:8px 12px 8px 14px;position:relative;font-size:14px;line-height:1.4;transition:box-shadow var(--hq-ease),opacity var(--hq-ease)}
.blk:hover{box-shadow:inset 0 0 0 1px var(--line-strong)}
.blk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:6px 0 0 6px}
.blk.onb{background:var(--onb-bg)} .blk.onb::before{background:var(--onb-bar)}
.blk.trn{background:var(--trn-bg)} .blk.trn::before{background:var(--trn-bar)}
.blk.setup{background:var(--setup-bg)} .blk.setup::before{background:var(--setup-bar)}
.blk.event{background:var(--event-bg)} .blk.event::before{background:var(--event-bar)}
.blk .time{display:block;font-size:12px;color:var(--muted);font-weight:500}
.blk .ttl{display:block;font-weight:600;font-size:14px;line-height:1.3;margin:2px 0 4px}
.blk .place{display:block;color:var(--muted)}
.blk .place b{color:var(--text);font-weight:500}
.with{display:flex;align-items:flex-start;gap:8px;margin-top:8px;font-size:12px}
.with .lbl{color:var(--muted);line-height:22px}
.blk.float{outline:1px dashed var(--onb-bar);outline-offset:-1px}
.blk.done{opacity:.6}
.blk.done .ttl{text-decoration:line-through;text-decoration-thickness:1.5px}
.check{position:absolute;right:8px;top:8px;width:18px;height:18px;border-radius:50%;background:var(--pill-bg);color:var(--pill-text);font-size:11px;display:flex;align-items:center;justify-content:center}
.blk.dim{opacity:.2}
.blk.gone{display:none}
body.editing .blk{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.blk.dragging{opacity:.3}
.drag-ghost{position:fixed!important;z-index:50;pointer-events:none;box-shadow:var(--hq-shadow-pop);opacity:.95;margin:0}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.blk.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* agenda */
.agenda{margin-top:32px;display:grid;gap:16px}
.aday{background:var(--surface);border:1px solid var(--line);border-radius:var(--hq-radius);padding:16px 20px;display:grid;grid-template-columns:130px 1fr;gap:16px}
.aday.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.aday.past{opacity:.75}
.aday h3{margin:0;font-size:18px;font-weight:600;line-height:1.25}
.aday h3 span{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.aday h3 em{display:inline-block;margin-top:4px}
.alist{display:grid;gap:8px}
.slotlab{font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.alist .blk{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.alist .blk .with{margin:0;justify-content:flex-end}
.alist .free{justify-content:flex-start;padding:4px 0}

/* tray */
.tray{margin:32px 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--hq-radius);padding:20px}
.tray h2{font-size:18px;font-weight:600;line-height:1.25;margin:0 0 4px}
.tray p{margin:0 0 12px;color:var(--muted);font-size:14px}
.tray .list{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;border-radius:var(--hq-radius-sm);padding:4px;transition:background-color var(--hq-ease)}
.tray .list.over{background:var(--accent-pale);box-shadow:inset 0 0 0 2px var(--accent)}
.tray .blk{min-width:240px}
footer{color:var(--muted);font-size:12px;padding:16px 0 48px}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.savebar .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:0}
.savebar .msg{font-size:14px;flex:1;min-width:220px;line-height:1.4}
.savebar .msg b{font-weight:600}
.savebar .msg .checks{display:block;color:var(--warn);font-size:12px}
.savebar .msg.err b{color:var(--danger)}
.savebar .msg.ok b{color:var(--ok)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:var(--hq-radius);padding:0;max-width:520px;width:calc(100% - 32px);max-height:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:var(--hq-shadow-pop)}
dialog::backdrop{background:rgba(23,24,25,.45)}
.dtop{height:4px}
.dbody{padding:20px 24px 24px}
.dbody .cat{font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.dbody .cat i{width:10px;height:10px;border-radius:3px}
.dbody h3{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:4px 0 16px;line-height:1.25}
.dbody dl{display:grid;grid-template-columns:110px 1fr;gap:8px 16px;margin:0 0 24px;font-size:14px}
.dbody dt{color:var(--muted)}
.dbody dd{margin:0;font-weight:500}
.daylist{display:grid;gap:8px;margin-bottom:20px}
.dl-item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:96px 1fr;gap:16px;padding:8px 12px;border-radius:var(--hq-radius-sm);background:var(--row);font-size:14px}
.dl-item:hover{box-shadow:inset 0 0 0 1px var(--line-strong)}
.dl-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dl-item .w{font-size:12px;color:var(--muted);line-height:1.6}
.dl-item b{font-weight:600;display:block}
.dl-item small{color:var(--muted);font-size:12px}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.dact .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border:1px solid transparent;border-radius:var(--hq-radius);padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;transition:background-color var(--hq-ease),border-color var(--hq-ease)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--text)}
.btn.ghost:hover{background:var(--row)}
.btn.ghost:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:transparent;color:var(--danger);padding-left:4px}
.btn.danger:hover{text-decoration:underline;text-underline-offset:3px}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.form .full{grid-column:1/-1}
.field[hidden]{display:none}
.field{display:grid;align-content:start;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
.form input[type=text],.form select,.form textarea{width:100%;min-height:40px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--hq-radius);padding:8px 12px;font-size:16px;font-weight:400;color:var(--text);transition:border-color var(--hq-ease)}
.form input:hover,.form select:hover,.form textarea:hover{border-color:var(--muted)}
.form input:focus-visible,.form select:focus-visible,.form textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.form textarea{min-height:64px;resize:vertical}
.form .err{color:var(--danger);font-size:12px}
.typepick{display:flex;flex-wrap:wrap;gap:8px}
.typepick label,.pp label{display:inline-flex;align-items:center;gap:8px;min-height:32px;border:1px solid var(--line-strong);border-radius:999px;padding:0 12px;color:var(--text);cursor:pointer;font-weight:400;font-size:14px;transition:background-color var(--hq-ease),border-color var(--hq-ease)}
.typepick label i{width:10px;height:10px;border-radius:3px}
.typepick label:has(input:checked),.pp label:has(input:checked){border-color:var(--accent);background:var(--accent-pale);color:var(--accent-ink);font-weight:600}
.typepick input,.pp input{position:absolute;opacity:0;pointer-events:none}
.typepick label:has(input:focus-visible),.pp label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pp{display:flex;flex-wrap:wrap;gap:8px}
.presets{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.presets button{min-height:28px;border:1px solid var(--line-strong);background:transparent;border-radius:var(--hq-radius-sm);padding:0 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.presets button:hover{border-color:var(--text);color:var(--text)}
.addp{display:flex;gap:8px;margin-top:8px}
.addp input{flex:1;min-height:40px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--hq-radius);padding:0 12px;font-size:16px}
.inline{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;cursor:pointer;min-height:32px}

@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr;gap:20px}
  .aday{grid-template-columns:1fr;gap:8px}
  .alist .blk{grid-template-columns:1fr}
  .alist .blk .with{justify-content:flex-start}
  .right{margin-left:0}
  .form{grid-template-columns:1fr}
}
@media (pointer:coarse),(max-width:639px){
  .editbtn,.todaybtn,.who select,.btn,.addp input,.form input[type=text],.form select{min-height:44px}
  .seg button{min-height:40px}
  .chip,.typepick label,.pp label,.link,.add,.inline{min-height:40px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  .top,.controls,.savebar,.editbtn,.next,.tray,footer,.add{display:none!important}
  .hero{padding:16px 0}
  body{background:#fff} .cell{min-height:auto}
}
</style>
</head>
<body>
<div id="root"></div>

}
function slotOptions(cur){
  let o="";[1,2].forEach(w=>{o+=`<optgroup label="Week ${w}">`;DAYS.filter(d=>d.w===w&&!d.off).forEach(d=>["am","pm"].forEach(h=>{const v=d.iso+"|"+h;o+=`<option value="${v}"${v===cur?" selected":""}>${slotLabel(v)}</option>`}));o+=`</optgroup>`});
  return o+`<option value="tray"${cur==="tray"?" selected":""}>Still to schedule (no date yet)</option>`;
}
const pplBox=(p,on)=>`<label><input type="checkbox" name="with" value="${esc(p.k)}"${on?" checked":""}>${esc(p.n)}</label>`;
function openEditor(id,slot){
  const isNew=!id;
  const i=isNew?{t:"",c:"event",time:"",client:"",venue:"",with:[],note:"",float:false,slot:slot||"tray"}:S.sessions.find(x=>x.id===id);
  $("dTop").style.background=BAR[i.c];
  $("dBody").innerHTML=`<div class="cat">${isNew?"New session":"Edit session"}</div><h3 id="dTitle">${isNew?"Add a session":esc(i.t)}</h3>
  <div class="form" id="ef" data-id="${isNew?"":i.id}">
    <label class="field full">What<input type="text" id="f-t" value="${esc(i.t)}" placeholder="e.g. Event set-up" autocomplete="off"><span class="err" id="f-err" hidden>Give the session a name.</span></label>
    <div class="field full">Type<div class="typepick" role="radiogroup">${Object.keys(CATS).map(c=>`<label><input type="radio" name="f-c" value="${c}"${c===i.c?" checked":""}><i style="background:${BAR[c]}"></i>${CATS[c]}</label>`).join("")}</div></div>
    <label class="field">When<select id="f-slot">${slotOptions(i.slot)}</select></label>
    <div class="field">Exact time (optional)<input type="text" id="f-time" value="${esc(specificTime(i))}" placeholder="e.g. 10:30 or From 16:00" autocomplete="off">
      <span class="presets"><button type="button" data-preset="09:00">09:00</button><button type="button" data-preset="14:00">14:00</button><button type="button" data-preset="When there’s time">When there’s time</button></span></div>
    <label class="field f-place"${i.c==="onb"?" hidden":""}>Client<input type="text" id="f-client" value="${esc(i.client)}" placeholder="Leave empty if none" autocomplete="off" list="clients"></label>
    <label class="field f-place"${i.c==="onb"?" hidden":""}>Venue<input type="text" id="f-venue" value="${esc(i.venue)}" placeholder="e.g. De Warande" autocomplete="off" list="venues"></label>
    <datalist id="clients">${[...new Set(S.sessions.map(x=>x.client).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join("")}</datalist>
    <datalist id="venues">${[...new Set(S.sessions.map(x=>x.venue).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join("")}</datalist>
    <div class="field full">With<div class="pp" id="f-ppl">${S.people.map(p=>pplBox(p,i.with.includes(p.k))).join("")}</div>
      <div class="addp"><input type="text" id="f-newp" placeholder="Someone else? Type a name" autocomplete="off"><button class="btn ghost" id="f-addp" type="button">Add</button></div></div>
    <label class="field full">Note for Dani (optional)<textarea id="f-note">${esc(i.note)}</textarea></label>
    <label class="inline full"><input type="checkbox" id="f-float"${i.float?" checked":""}> Flexible: fits in whenever there’s time</label>
  </div>
  <div class="dact">${isNew?"":`<button class="btn danger" id="f-del">Delete</button><button class="btn ghost" id="f-dup">Duplicate</button>`}<span class="grow"></span><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="f-apply">${isNew?"Add session":"Save session"}</button></div>`;
  show();if(isNew)setTimeout(()=>$("f-t").focus(),30);
}
function readForm(){
  const t=$("f-t").value.trim();if(!t){$("f-err").hidden=false;$("f-t").focus();return null}
  const slot=$("f-slot").value,time=$("f-time").value.trim();
  const v={t,c:(document.querySelector('input[name="f-c"]:checked')||{value:"event"}).value,slot,time:time||(slot==="tray"?"":slot.endsWith("|am")?"Morning":"Afternoon"),
    venue:$("f-venue").value.trim(),with:[...document.querySelectorAll('#f-ppl input[name=with]:checked')].map(x=>x.value),note:$("f-note").value.trim(),float:$("f-float").checked};
  const cl=$("f-client").value.trim();if(cl)v.client=cl;return v;
}
function applyForm(){
  const v=readForm();if(!v)return;const id=$("ef").dataset.id;snapshot();let nid=id;
  if(!id){nid=uid();S.sessions.push(Object.assign({id:nid},v))}
  else{const idx=S.sessions.findIndex(x=>x.id===id);const old=S.sessions[idx];const upd=Object.assign({},old,v);if(!v.client)delete upd.client;
    if(old.slot!==v.slot){S.sessions.splice(idx,1);S.sessions.push(upd)}else S.sessions[idx]=upd}
  st.msg="";dlg().close();render();flash(nid);
}
function moveSession(id,slot,beforeId){
  const idx=S.sessions.findIndex(x=>x.id===id);if(idx<0)return;
  const cur=S.sessions[idx];if(cur.slot===slot&&!beforeId&&S.sessions.map(x=>x.slot).lastIndexOf(slot)===idx)return;
  snapshot();
  const s=S.sessions.splice(idx,1)[0];
  if(s.slot!==slot&&GENERIC.test((s.time||"").trim()))s.time=slot==="tray"?"":slot.endsWith("|am")?"Morning":"Afternoon";
  s.slot=slot;
  let at=beforeId?S.sessions.findIndex(x=>x.id===beforeId):-1;
  if(at<0){const last=S.sessions.map(x=>x.slot).lastIndexOf(slot);at=last<0?S.sessions.length:last+1}
  S.sessions.splice(at,0,s);st.msg="";render();flash(id);
}

/* saving */
const EDITOR=new URLSearchParams(location.search).has("edit");
st.canEdit=EDITOR;st.canSave="yes";
if(!EDITOR&&st.edit){st.edit=false;ss.del(EDIT_KEY)}
function buildHTML(){
  const css=$("css").textContent,app=$("app").textContent,E="</"+"script>";
  const json=JSON.stringify(S).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"en\" data-hq=\"qed\">\n<head>\n"+HEAD+"<style id=\"css\">"+css+"</style>\n</head>\n<body>\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"state\">"+json+E+"\n<script id=\"app\">"+app+E+"\n</body>\n</html>\n";
}
function save(){
  const html=buildHTML(),blob=new Blob([html],{type:"text/html"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  savedJSON=JSON.stringify(S);ls.del(PEND_KEY);undo.length=0;
  st.msg="Downloaded index.html. Upload it to your site, replacing the current file, so everyone sees the changes.";st.msgKind="ok";render();
}
addEventListener("beforeunload",e=>{if(dirty()&&!st.saving){e.preventDefault();e.returnValue=""}});

/* events */
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-close]")){dlg().close();return}
  const pr=t.closest("[data-preset]");if(pr){$("f-time").value=pr.dataset.preset;return}
  const ad=t.closest("[data-add]");if(ad){openEditor(null,ad.dataset.add);return}
  const b=t.closest(".blk");if(b){openSession(b.dataset.id);return}
  const dh=t.closest("[data-day]");if(dh){openDay(dh.dataset.day);return}
  const s=t.closest("[data-session]");if(s){openSession(s.dataset.session);return}
  const od=t.closest("[data-openday]");if(od){openDay(od.dataset.openday);return}
  const ef=t.closest("[data-editfrom]");if(ef){st.edit=true;ss.set(EDIT_KEY,"1");render();openEditor(ef.dataset.editfrom);return}
  const tg=t.closest("[data-toggle]");if(tg){const id=tg.dataset.toggle;if(done[id])delete done[id];else done[id]=true;saveDone();render();dlg().close();return}
  if(t.closest("#next")){const id=$("next").dataset.id;if(id)openSession(id);return}
  if(t.closest("#gotoday")){const el=$("d-"+todayISO);if(el)el.scrollIntoView({block:"start"});return}
  const v=t.closest("[data-view]");if(v){st.view=v.dataset.view;render();return}
  const w=t.closest("[data-week]");if(w){st.week=w.dataset.week;render();return}
  const c=t.closest("[data-cat]");if(c){st.cats[c.dataset.cat]=!st.cats[c.dataset.cat];render();return}
  if(t.closest("#reset")){st.cats={onb:true,trn:true,setup:true,event:true};st.person="";render();return}
  if(t.closest("#editToggle")){st.edit=!st.edit;st.edit?ss.set(EDIT_KEY,"1"):ss.del(EDIT_KEY);st.msg="";render();return}
  if(t.closest("#doneEdit")){st.edit=false;ss.del(EDIT_KEY);st.msg="";render();return}
  if(t.closest("#undo")){doUndo();return}
  if(t.closest("#discard")){if(st.pending){st.pending=null;ls.del(PEND_KEY)}else{snapshot();S=JSON.parse(savedJSON)}st.msg="";render();return}
  if(t.closest("#save")){if(st.pending){S=JSON.parse(st.pending);st.pending=null;ls.del(PEND_KEY);st.edit=true;render();return}save();return}
  if(t.closest("#f-apply")){applyForm();return}
  if(t.closest("#f-addp")){const inp=$("f-newp"),n=inp.value.trim();if(!n)return;
    const ex=S.people.find(p=>p.n.toLowerCase()===n.toLowerCase());
    if(ex){const cb=document.querySelector(`#f-ppl input[value="${ex.k}"]`);if(cb)cb.checked=true;inp.value="";return}
    let k=n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"p";while(person(k))k+="-2";
    snapshot();S.people.push({k,n});$("f-ppl").insertAdjacentHTML("beforeend",pplBox({k,n},true));inp.value="";return}
  if(t.closest("#f-dup")){const id=$("ef").dataset.id;snapshot();const idx=S.sessions.findIndex(x=>x.id===id);const cp=Object.assign({},S.sessions[idx],{id:uid(),with:[...S.sessions[idx].with]});S.sessions.splice(idx+1,0,cp);dlg().close();render();flash(cp.id);return}
  if(t.closest("#f-del")){const id=$("ef").dataset.id;const nm=S.sessions.find(x=>x.id===id).t;snapshot();S.sessions=S.sessions.filter(x=>x.id!==id);delete done[id];saveDone();dlg().close();st.msg=`“${nm}” deleted. Use Undo to bring it back.`;st.msgKind="";render();return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="whoSel"){st.person=e.target.value;render()}
  if(e.target.name==="f-c"){$("dTop").style.background=BAR[e.target.value];document.querySelectorAll(".f-place").forEach(x=>x.hidden=e.target.value==="onb")}
});
document.addEventListener("keydown",e=>{
  const typing=e.target.closest&&e.target.closest("input,textarea,select");
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&st.edit&&!typing&&!dlg().open){e.preventDefault();doUndo();return}
  if(e.key==="Enter"&&e.target.id==="f-newp"){e.preventDefault();$("f-addp").click();return}
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("#ef")&&e.target.tagName==="INPUT"&&e.target.type==="text"&&!e.target.list){e.preventDefault();applyForm()}
});
document.addEventListener("click",e=>{if(e.target===dlg())dlg().close()},true);

/* drag and drop (pointer-based: mouse, trackpad and touch) */
let drag0=null,ghost=null,justDragged=false,holdT=null,scrollRAF=null,lastY=0;
function zoneAt(x,y){const el=document.elementFromPoint(x,y);return el?el.closest("[data-slot]"):null}
function clearOver(){document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))}
function autoScroll(){if(!drag0||!drag0.active)return;const m=80,h=innerHeight;if(lastY<m)scrollBy(0,-14);else if(lastY>h-m)scrollBy(0,14);scrollRAF=requestAnimationFrame(autoScroll)}
function startDrag(){const b=drag0.el,r=b.getBoundingClientRect();ghost=b.cloneNode(true);ghost.classList.add("drag-ghost");ghost.style.width=r.width+"px";ghost.style.left=r.left+"px";ghost.style.top=r.top+"px";document.body.appendChild(ghost);
  b.classList.add("dragging");drag0.active=true;drag0.ox=drag0.x-r.left;drag0.oy=drag0.y-r.top;document.body.classList.add("is-dragging");autoScroll()}
document.addEventListener("pointerdown",e=>{if(!st.edit||e.button>0)return;const b=e.target.closest&&e.target.closest(".blk");if(!b||dlg().contains(b))return;
  drag0={el:b,id:b.dataset.id,x:e.clientX,y:e.clientY,type:e.pointerType,active:false};lastY=e.clientY;
  if(e.pointerType!=="mouse"){clearTimeout(holdT);holdT=setTimeout(()=>{if(drag0&&!drag0.active){startDrag();if(navigator.vibrate)navigator.vibrate(15)}},350)}});
document.addEventListener("pointermove",e=>{if(!drag0)return;lastY=e.clientY;
  if(!drag0.active){const dist=Math.hypot(e.clientX-drag0.x,e.clientY-drag0.y);
    if(drag0.type==="mouse"){if(dist>5){e.preventDefault();startDrag()}else return}else{if(dist>10){clearTimeout(holdT);drag0=null}return}}
  e.preventDefault();ghost.style.left=(e.clientX-drag0.ox)+"px";ghost.style.top=(e.clientY-drag0.oy)+"px";
  const z=zoneAt(e.clientX,e.clientY);clearOver();if(z)z.classList.add("over")},{passive:false});
document.addEventListener("touchmove",e=>{if(drag0&&drag0.active)e.preventDefault()},{passive:false});
document.addEventListener("dragstart",e=>{if(st.edit&&e.target.closest&&e.target.closest(".blk"))e.preventDefault()});
document.addEventListener("contextmenu",e=>{if(st.edit&&e.target.closest&&e.target.closest(".blk"))e.preventDefault()});
function endDrag(e){clearTimeout(holdT);if(!drag0)return;const d=drag0;drag0=null;cancelAnimationFrame(scrollRAF);if(!d.active)return;
  justDragged=true;setTimeout(()=>{justDragged=false},80);
  if(ghost){ghost.remove();ghost=null}d.el.classList.remove("dragging");document.body.classList.remove("is-dragging");clearOver();
  if(e.type==="pointercancel")return;
  const z=zoneAt(e.clientX,e.clientY);if(!z)return;
  const tray=z.id==="tray";let before=null;
  for(const s of [...z.querySelectorAll(".blk")].filter(x=>x.dataset.id!==d.id)){const r=s.getBoundingClientRect();
    const isBefore=tray?(e.clientY<r.top||(e.clientY<=r.bottom&&e.clientX<r.left+r.width/2)):(e.clientY<r.top+r.height/2);
    if(isBefore){before=s.dataset.id;break}}
  moveSession(d.id,z.dataset.slot,before)}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);
document.addEventListener("click",e=>{if(justDragged){e.stopPropagation();e.preventDefault()}},true);

frame();render();
if(inRange&&st.view==="agenda")setTimeout(()=>{const el=$("d-"+todayISO);if(el)el.scrollIntoView({block:"start"})},100);
})();
</script>
</body>
</html>
