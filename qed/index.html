<!DOCTYPE html>
<html lang="en" data-hq="qed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>QED HQ</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171819" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/qed-hq-icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="assets/qed-hq-icon-180.png">
<link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/hq-tokens.css">
<link rel="stylesheet" href="css/app.css">
<!-- The app: login check (shared hq login + QED HQ's own database), then the screens. -->
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="top">
  <div class="wrap top-row">
    <hq-switcher current="qed"><a href="#/home">QED HQ</a></hq-switcher>
    <nav class="top-nav" aria-label="QED HQ">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/priorities" data-route="priorities">Priorities</a>
      <a href="#/planner" data-route="planner">Planner</a>
      <a href="#/sales" data-route="sales">Sales</a>
    </nav>
    <button type="button" class="top-search icon-btn" id="open-search" aria-label="Search (Ctrl K or /)" title="Search  (⌘K or /)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </div>
</div>

<main class="wrap main">
  <h1 id="page-title" class="page-title"></h1>
  <div id="view" aria-live="polite"><p class="muted loading">Loading QED HQ…</p></div>
</main>

<!-- Phone: the same four tabs as a bottom bar. -->
<nav class="tabbar" aria-label="QED HQ">
  <a href="#/home" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Home</span></a>
  <a href="#/priorities" data-route="priorities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 2 2 4-4"/><path d="m3 14 2 2 4-4"/><path d="M13 6h8"/><path d="M13 14h8"/><path d="M13 20h8"/></svg><span>Priorities</span></a>
  <a href="#/planner" data-route="planner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/><path d="M9 14h2"/><path d="M13 14h2"/><path d="M9 17h2"/></svg><span>Planner</span></a>
  <a href="#/sales" data-route="sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17 9 11l4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Sales</span></a>
</nav>

<footer class="footer">
  <div class="wrap">Part of <a href="https://ownhq.app">HQ</a></div>
</footer>
</body>
</html>
