<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Shared hq login: page hidden until logged in (hq-home/gate.js) -->
<style id="hq-gate">html{visibility:hidden}</style>
<script type="module" src="https://ownhq.app/gate.js"></script>
<title>QED Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2C4D5C; --green:#27C490; --green-ink:#178a63;
  --bg:#F5F5F5; --surface:#FFFFFF; --text:#2C4D5C; --muted:#5a6b73; --line:#dfe5e8; --hero:#2C4D5C;
  --icon-bg:#e3f7ef; --icon:#178a63;
  --font:"Poppins","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13232b; --surface:#1b2f38; --text:#e8eff1; --muted:#a9bbc2; --line:#2f4955; --hero:#0e1c22;
    --green-ink:#4fdcab; --icon-bg:#173d33; --icon:#4fdcab; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13232b; --surface:#1b2f38; --text:#e8eff1; --muted:#a9bbc2; --line:#2f4955; --hero:#0e1c22;
  --green-ink:#4fdcab; --icon-bg:#173d33; --icon:#4fdcab; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px;width:100%}

.hero{background:var(--hero);color:#fff;padding:28px 0 72px}
.hero img{height:34px;width:auto;display:block;margin-bottom:32px}
.hero h1{font-size:clamp(1.8rem,1.4rem + 2vw,2.6rem);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px}
.hero p{margin:0;color:#d5e2e7;max-width:40ch}

main.wrap{flex:1;margin-top:-44px;padding-bottom:48px;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 8px 24px rgba(44,77,92,.12)}
.icon{width:48px;height:48px;border-radius:12px;background:var(--icon-bg);color:var(--icon);display:grid;place-items:center}
.icon svg{width:24px;height:24px}
.tile h2{font-size:1rem;font-weight:600;margin:0}
.tile .host{font-size:.8rem;color:var(--muted);margin-top:auto;display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.tile .host svg{width:14px;height:14px;flex:none}

.section-title{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:40px 0 12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:var(--green);color:#0e1c22;font-weight:600;text-decoration:none;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn svg{width:20px;height:20px}

footer{padding:20px 0;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line)}
footer a{color:inherit}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <img src="assets/qed-logo-white.png" alt="QED" width="69" height="34">
    <h1>QED Tools</h1>
    <p>Quick access to QED's internal tools and pages.</p>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <a class="tile" href="https://registration-review.qedapp.eu/" target="_blank" rel="noopener">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg></span>
      <h2>Registration review</h2>
      <span class="host"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>registration-review.qedapp.eu</span>
    </a>
    <a class="tile" href="https://www.euevent.eu/fd-xl-to-csv/" target="_blank" rel="noopener">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></svg></span>
      <h2>FD XL to CSV</h2>
      <span class="host"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>euevent.eu/fd-xl-to-csv</span>
    </a>
    <a class="tile" href="https://admin-bespoke.qedapp.eu/" target="_blank" rel="noopener">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></span>
      <h2>Bespoke admin</h2>
      <span class="host"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>admin-bespoke.qedapp.eu</span>
    </a>
    <a class="tile" href="https://partners.qed.eu/digital-services" target="_blank" rel="noopener">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg></span>
      <h2>Digital services</h2>
      <span class="host"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>partners.qed.eu/digital-services</span>
    </a>
  </div>

  <h2 class="section-title">Team</h2>
  <a class="btn" href="onboarding/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
    Onboarding plan
  </a>
</main>

<footer>
  <div class="wrap">Part of <a href="https://ownhq.app">hq</a></div>
</footer>
</body>
</html>
